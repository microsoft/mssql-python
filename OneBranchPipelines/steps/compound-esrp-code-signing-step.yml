# =========================================================================================
# ESRP Code Signing Step Template - Windows native Python extension (.pyd)
# =========================================================================================
# Authenticode-signs OUR own PE-format binary - the compiled Python extension
# `ddbc_bindings.*.pyd` - using Microsoft's Enterprise Secure Release Process (ESRP)
# with the CP-230012 certificate.
#
# SCOPE: The caller passes an explicit `pattern` naming exactly the file(s) we own
# (e.g. `ddbc_bindings.cp312-amd64.pyd`). We deliberately do NOT sign with a broad
# `*.pyd` / `*.dll` net: other binaries that may sit next to our extension (e.g. the
# vcredist `msvcp140.dll` copied by build.bat) are already signed by their publishers
# and are not ours to re-sign. Malware scanning, signing, and the verification gate
# below all operate on the same explicit `pattern` so the three scopes stay identical.
#
# WHY WE SIGN THE .pyd AND NOT THE .whl
# -------------------------------------
# A Python wheel (`.whl`) is a ZIP archive, not a PE-format binary, so Windows
# SignTool / ESRP SigntoolSign cannot Authenticode-sign the wheel itself. The
# supported approach is to sign the native binary *inside* the wheel. In this repo
# the extension `.pyd` is built in a dedicated step BEFORE `setup.py bdist_wheel`
# packages it, so we sign the `.pyd` in place. The signed binary then flows into:
#   - the `.whl` produced by bdist_wheel (RECORD hashes stay correct because we sign
#     before packaging - no unpack/repack/regenerate needed),
#   - the standalone `bindings/windows` artifact, and
#   - the apiScan copy used by SDL binary scanning.
#
# This template runs in BOTH Official and NonOfficial pipeline runs so every wheel
# we publish (from any pipeline flavor) contains a signed extension.
#
# Certificate: CP-230012 "SHA256 Authenticode" (Microsoft Corporation, external distribution)
# Operation:   SigntoolSign + SigntoolVerify (Windows SignTool - PE-format binaries)
# =========================================================================================
parameters:
  - name: appRegistrationClientId
    type: string
    displayName: 'ESRP App Registration Client ID'

  - name: appRegistrationTenantId
    type: string
    displayName: 'ESRP App Registration Tenant ID'

  - name: authAkvName
    type: string
    displayName: 'Azure Key Vault name holding the signing certificate'

  - name: authSignCertName
    type: string
    displayName: 'Signing certificate name'

  - name: esrpClientId
    type: string
    displayName: 'ESRP Client ID'

  - name: esrpConnectedServiceName
    type: string
    displayName: 'ESRP Connected Service Name (federated MSI)'

  - name: signPath
    type: string
    displayName: 'Folder containing the native extension to sign'

  - name: pattern
    type: string
    displayName: 'Explicit file name(s) to sign, comma-separated (e.g. ddbc_bindings.cp312-amd64.pyd). No default - callers MUST scope this to the specific files they own.'

steps:
  # -----------------------------------------------------------------------------
  # 1) Malware scan the native extension before signing (ESRP compliance gate).
  # -----------------------------------------------------------------------------
  - task: EsrpMalwareScanning@5
    displayName: 'ESRP MalwareScanning - Native extension'
    inputs:
      ConnectedServiceName: '${{ parameters.esrpConnectedServiceName }}'
      AppRegistrationClientId: '${{ parameters.appRegistrationClientId }}'
      AppRegistrationTenantId: '${{ parameters.appRegistrationTenantId }}'
      EsrpClientId: '${{ parameters.esrpClientId }}'
      UseMSIAuthentication: true
      FolderPath: '${{ parameters.signPath }}'
      Pattern: '${{ parameters.pattern }}'
      SessionTimeout: 60
      CleanupTempStorage: 1
      VerboseLogin: 1

  # -----------------------------------------------------------------------------
  # 2) Authenticode-sign the native extension with CP-230012.
  # -----------------------------------------------------------------------------
  - task: EsrpCodeSigning@5
    displayName: 'ESRP CodeSigning - Native extension (.pyd)'
    inputs:
      ConnectedServiceName: '${{ parameters.esrpConnectedServiceName }}'
      AppRegistrationClientId: '${{ parameters.appRegistrationClientId }}'
      AppRegistrationTenantId: '${{ parameters.appRegistrationTenantId }}'
      EsrpClientId: '${{ parameters.esrpClientId }}'
      UseMSIAuthentication: true
      AuthAKVName: '${{ parameters.authAkvName }}'
      AuthSignCertName: '${{ parameters.authSignCertName }}'
      FolderPath: '${{ parameters.signPath }}'
      Pattern: '${{ parameters.pattern }}'
      signConfigType: inlineSignParams
      inlineOperation: |
        [
          {
            "keyCode": "CP-230012",
            "operationSetCode": "SigntoolSign",
            "parameters": [
              {
                "parameterName": "OpusName",
                "parameterValue": "mssql-python"
              },
              {
                "parameterName": "OpusInfo",
                "parameterValue": "https://www.microsoft.com"
              },
              {
                "parameterName": "FileDigest",
                "parameterValue": "/fd \"SHA256\""
              },
              {
                "parameterName": "PageHash",
                "parameterValue": "/NPH"
              },
              {
                "parameterName": "TimeStamp",
                "parameterValue": "/tr \"http://rfc3161.gtm.corp.microsoft.com/TSS/HttpTspServer\" /td sha256"
              }
            ],
            "toolName": "sign",
            "toolVersion": "1.0"
          },
          {
            "keyCode": "CP-230012",
            "operationSetCode": "SigntoolVerify",
            "parameters": [],
            "toolName": "sign",
            "toolVersion": "1.0"
          }
        ]

  # -----------------------------------------------------------------------------
  # 3) Independent Authenticode verification gate - fail the build if the file(s)
  #    we just signed are unsigned or have an invalid signature. Uses the SAME
  #    explicit `pattern` as the sign step so the verification scope matches the
  #    signing scope exactly (no broad *.pyd/*.dll rescan). Prints the signer
  #    subject as evidence in the build log.
  # -----------------------------------------------------------------------------
  - pwsh: |
      $ErrorActionPreference = 'Stop'

      # Same explicit, comma-separated pattern that was signed above.
      $patterns = @('${{ parameters.pattern }}'.Split(',') | ForEach-Object { $_.Trim() } | Where-Object { $_ })

      $files = @(Get-ChildItem -Path '${{ parameters.signPath }}' -Recurse -Include $patterns -File)
      if ($files.Count -eq 0) {
        Write-Error "No files matching pattern(s) '$($patterns -join ", ")' found to verify under '${{ parameters.signPath }}'"
        exit 1
      }

      $invalid = @()
      foreach ($file in $files) {
        $signature = Get-AuthenticodeSignature $file.FullName
        Write-Host "$($file.Name): $($signature.Status) [$($signature.SignerCertificate.Subject)]"
        if ($signature.Status -ne 'Valid') {
          $invalid += $file.FullName
        }
      }

      if ($invalid.Count -gt 0) {
        Write-Error "Unsigned or invalid signed file(s):`n$($invalid -join "`n")"
        exit 1
      }

      Write-Host "All signed file(s) are Authenticode 'Valid'."
    displayName: 'Verify Authenticode signature (native extension)'
