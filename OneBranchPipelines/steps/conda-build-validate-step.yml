# Conda Build + Validate Step Template
# ============================================================================
# Repackages the prebuilt, ESRP-signed wheels produced by THIS build leg into
# conda packages, then validates them on the SAME native agent (which already
# has the matching wheel, the external mssql-python-odbc wheel, and a live
# SQL Server for pytest). Include this AFTER the wheel is built on a build leg.
#
# WHY THIS RUNS PER-PLATFORM (not on a single host like ODBC_BuildAll):
#   `ODBC_BuildAll` cross-produces every wheel on one host because setup_odbc.py
#   only RE-TAGS a data zip. conda-build is different: it provisions a real host
#   environment for the target subdir and `pip install`s the matching wheel
#   (see conda/*/bld.bat|build.sh). A linux-64 / osx-* host env cannot be created
#   on a Windows agent, so — exactly like the wheels and like the conda-forge
#   pyodbc-feedstock — each conda package must be built on its matching platform.
#
# SCOPE / LIMITATIONS (first cut, intentionally conservative):
#   * Native legs are import-validated. A CROSS leg (condaTargetSubdir set, e.g.
#     win-arm64 on x64) cannot execute the target Python, so its runtime import
#     auto-skips -- but the recipe still enforces a BLOCKING --dry-run dependency
#     solve and (win-arm64) a PE machine-type assert, so it is validated, not trusted.
#   * musllinux has NO conda target (conda linux-* is glibc), so this step is
#     never included on the musllinux legs.
#
# This step ONLY builds + validates + stages conda packages as an artifact. It
# does NOT publish anything — publishing (anaconda upload / ESRP) happens in the
# release pipeline, exactly like the wheels.
parameters:
  # Python version(s) to build, comma-separated X.Y (e.g. '3.13' or '3.12,3.13,3.14'); passed
  # straight to the orchestrator's --python-versions. win-64 follows the pythonVersions
  # parameter; win-arm64 uses a fixed 3.12-3.14 set (the singular name is kept for callers).
  - name: pythonVersion
    type: string
  # Conda subdir for this leg's package metadata + staging: 'win-64' (native) or 'win-arm64'
  # (CROSS-built on this x64 agent via condaTargetSubdir). Need NOT match the host arch.
  - name: condaSubdir
    type: string
  # Optional target subdir to CROSS-build via CONDA_SUBDIR on this (x64) agent, e.g.
  # 'win-arm64'. Empty = build the host's native subdir. On a cross leg the arm64 Python
  # cannot execute here, so the runtime import auto-skips; the deps still solve (from
  # Anaconda `defaults` + the microsoft noarch azure-identity/msal) and the package is
  # built + staged. Pair with continueOnError=true.
  - name: condaTargetSubdir
    type: string
    default: ''
  # Directory holding the freshly built mssql-python wheel (setup.py bdist_wheel).
  - name: mssqlWheelDir
    type: string
    default: '$(Build.SourcesDirectory)/dist'
  # Directory holding the downloaded external mssql-python-odbc wheel(s)
  # (populated by the leg's `installOdbcWheel` download step).
  - name: odbcWheelDir
    type: string
    default: '$(Pipeline.Workspace)/odbc_wheels'
  # Filename filter selecting THIS platform's mssql-python-odbc wheel from the
  # consolidated odbc drop (which contains ALL 7 platforms). MUST match the leg's
  # OS/arch, otherwise conda-build's `pip install` on this host fails with
  # DistributionNotFound (a macOS/linux wheel is not installable on win-64, etc.).
  - name: odbcWheelFilter
    type: string
    default: 'mssql_python_odbc-*win_amd64.whl'
  # Repo conda/ recipe root (contains mssql-python/ and mssql-python-odbc/).
  - name: recipeRoot
    type: string
    default: '$(Build.SourcesDirectory)/conda'
  # Space-free working dir for the conda croot + Miniforge + built packages.
  - name: outputDir
    type: string
    default: '$(Agent.TempDirectory)/conda-bld'
  # The shared cross-platform build+validate orchestrator (installs Miniforge/conda-build,
  # builds the self-contained mssql-python package, indexes a local channel, solves + imports).
  - name: scriptPath
    type: string
    default: '$(Build.SourcesDirectory)/OneBranchPipelines/scripts/build_conda_packages.py'
  # BLOCKING by default: if conda cannot build/validate the packages, FAIL the leg
  # instead of letting a green build hide a broken conda package. Callers running an
  # intentionally best-effort emulated leg (e.g. linux-aarch64 under QEMU) may override
  # this to true.
  - name: continueOnError
    type: boolean
    default: false

steps:
  - powershell: |
      $ErrorActionPreference = 'Stop'

      # One orchestrator (build_conda_packages.py) does gather + build + audit + verify + stage
      # for EVERY leg -- the two build scripts collapsed into one. The caller value-inputs come
      # via the step env: block (NOT interpolated into the command); the orchestrator validates
      # them itself. Run under the agent's bootstrap `python` (the orchestrator installs Miniforge).
      python "${{ parameters.scriptPath }}" `
        --mssql-wheel-dir "${{ parameters.mssqlWheelDir }}" `
        --odbc-wheel-dir "${{ parameters.odbcWheelDir }}" `
        --odbc-wheel-filter "${{ parameters.odbcWheelFilter }}" `
        --recipe-root "${{ parameters.recipeRoot }}" `
        --output-dir "${{ parameters.outputDir }}" `
        --stage-dir "$(ob_outputDirectory)/conda" `
        --conda-subdir "${{ parameters.condaSubdir }}" `
        --conda-target-subdir "$env:CONDA_TARGET_SUBDIR" `
        --python-versions "$env:PYTHON_VERSION"
      if ($LASTEXITCODE -ne 0) { Write-Error "conda build+validate failed (exit $LASTEXITCODE)"; exit 1 }
    env:
      # Surface the caller's value inputs as env vars (validated in-script above) rather than
      # interpolating them into the script text -- repo secret-handling convention.
      PYTHON_VERSION: ${{ parameters.pythonVersion }}
      CONDA_TARGET_SUBDIR: ${{ parameters.condaTargetSubdir }}
    displayName: 'Conda build + validate (${{ parameters.condaSubdir }} py${{ parameters.pythonVersion }})'
    continueOnError: ${{ parameters.continueOnError }}
