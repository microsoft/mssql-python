# Conda Build + Validate Step Template
# ============================================================================
# Repackages the prebuilt, ESRP-signed wheels produced by THIS build leg into
# conda packages, then validates them on the SAME native agent (which already
# has the matching wheel, the external mssql-python-odbc wheel, and a live
# SQL Server for pytest). Include this AFTER the wheel is built on a build leg.
#
# WHY THIS RUNS PER-PLATFORM (not on a single host like ODBC_BuildAll):
#   `ODBC_BuildAll` cross-produces every wheel on one host because setup_odbc.py
#   only RE-TAGS a data zip. conda-build is different: it provisions a real host
#   environment for the target subdir and `pip install`s the matching wheel
#   (see conda/*/bld.bat|build.sh). A linux-64 / osx-* host env cannot be created
#   on a Windows agent, so — exactly like the wheels and like the conda-forge
#   pyodbc-feedstock — each conda package must be built on its matching platform.
#
# SCOPE / LIMITATIONS (first cut, intentionally conservative):
#   * x64 / native only. Skipped on cross-arch legs (e.g. Windows ARM64) because
#     the import validation cannot execute on the x64 host AND conda cannot
#     provision a win-arm64 host env there — same reason pytest is skipped there.
#   * musllinux has NO conda target (conda linux-* is glibc), so this step is
#     never included on the musllinux legs.
#
# This step ONLY builds + validates + stages conda packages as an artifact. It
# does NOT publish anything — publishing (anaconda upload / ESRP) happens in the
# release pipeline, exactly like the wheels.
parameters:
  # Python version this leg builds, X.Y (e.g. '3.13'). One conda build per leg.
  - name: pythonVersion
    type: string
  # conda subdir to stamp on the packages (win-64, osx-64, osx-arm64,
  # linux-64, linux-aarch64). Must match the platform of THIS agent.
  - name: condaSubdir
    type: string
  # Target architecture of the wheel build; the step is skipped unless 'x64'
  # (or a native arch) so cross-compiled legs don't attempt a conda build.
  - name: targetArch
    type: string
    default: 'x64'
  # Directory holding the freshly built mssql-python wheel (setup.py bdist_wheel).
  - name: mssqlWheelDir
    type: string
    default: '$(Build.SourcesDirectory)/dist'
  # Directory holding the downloaded external mssql-python-odbc wheel(s)
  # (populated by the leg's `installOdbcWheel` download step).
  - name: odbcWheelDir
    type: string
    default: '$(Pipeline.Workspace)/odbc_wheels'
  # Filename filter selecting THIS platform's mssql-python-odbc wheel from the
  # consolidated odbc drop (which contains ALL 7 platforms). MUST match the leg's
  # OS/arch, otherwise conda-build's `pip install` on this host fails with
  # DistributionNotFound (a macOS/linux wheel is not installable on win-64, etc.).
  - name: odbcWheelFilter
    type: string
    default: 'mssql_python_odbc-*win_amd64.whl'
  # Repo conda/ recipe root (contains mssql-python/ and mssql-python-odbc/).
  - name: recipeRoot
    type: string
    default: '$(Build.SourcesDirectory)/conda'
  # Space-free working dir for the conda croot + Miniforge + built packages.
  - name: outputDir
    type: string
    default: '$(Agent.TempDirectory)/conda-bld'
  # The shared build+validate script (installs Miniforge/conda-build, builds the
  # companion then the binding, indexes a local channel, solves + imports both).
  - name: scriptPath
    type: string
    default: '$(Build.SourcesDirectory)/OneBranchPipelines/scripts/build-conda-packages.ps1'
  # BLOCKING by default: if conda cannot build/validate the packages, FAIL the leg
  # instead of letting a green build hide a broken conda package. Callers running an
  # intentionally best-effort emulated leg (e.g. linux-aarch64 under QEMU) may override
  # this to true.
  - name: continueOnError
    type: boolean
    default: false
  # Which package(s) this step builds. Windows legs build ONLY the per-Python binding
  # ('binding'); the Python-agnostic companion (mssql-python-odbc) is built ONCE in the
  # ODBC_BuildAll stage and SEEDED here so the binding's version-locked
  # `mssql-python-odbc ==<ver>` pin resolves in the validation solve WITHOUT rebuilding
  # the companion per Python. Use 'all' to also build the companion (legacy behaviour).
  - name: package
    type: string
    default: 'binding'
  # Artifact holding the prebuilt companion conda, staged under conda/<subdir>/ by the
  # ODBC_BuildAll stage. Downloaded + seeded in 'binding' mode.
  - name: driverCondaArtifact
    type: string
    default: 'drop_ODBC_BuildAll_BuildWheel'
  # Local folder the prebuilt companion conda is downloaded to (binding mode only).
  - name: driverCondaDownloadDir
    type: string
    default: '$(Agent.TempDirectory)/driver-conda'

steps:
  # binding mode: fetch the Python-agnostic companion conda built once in ODBC_BuildAll
  # so the binding's `mssql-python-odbc ==<ver>` pin resolves in the validation solve.
  - ${{ if eq(parameters.package, 'binding') }}:
    - task: DownloadPipelineArtifact@2
      displayName: 'Download prebuilt companion conda (ODBC_BuildAll)'
      condition: ne('${{ parameters.targetArch }}', 'arm64')
      inputs:
        buildType: 'current'
        artifactName: '${{ parameters.driverCondaArtifact }}'
        itemPattern: '**/conda/**/*.conda'
        targetPath: '${{ parameters.driverCondaDownloadDir }}'

  - powershell: |
      $ErrorActionPreference = 'Stop'

      $mssqlWheelDir = "${{ parameters.mssqlWheelDir }}"
      $odbcWheelDir  = "${{ parameters.odbcWheelDir }}"

      # Gather both packages' wheels into ONE find-links dir the recipes install from.
      $links = Join-Path "${{ parameters.outputDir }}" 'wheels'
      New-Item -ItemType Directory -Force -Path $links | Out-Null

      $mssqlWheel = Get-ChildItem -Path $mssqlWheelDir -Filter 'mssql_python-*.whl' -ErrorAction SilentlyContinue |
        Where-Object { $_.Name -notlike 'mssql_python_odbc-*' } | Select-Object -First 1
      if (-not $mssqlWheel) { Write-Error "No mssql_python-*.whl found in $mssqlWheelDir"; exit 1 }

      $odbcWheel = Get-ChildItem -Path $odbcWheelDir -Recurse -Filter '${{ parameters.odbcWheelFilter }}' -ErrorAction SilentlyContinue |
        Select-Object -First 1
      if (-not $odbcWheel) { Write-Error "No wheel matching '${{ parameters.odbcWheelFilter }}' found in $odbcWheelDir"; exit 1 }

      Copy-Item $mssqlWheel.FullName -Destination $links -Force
      Copy-Item $odbcWheel.FullName  -Destination $links -Force
      Write-Host "find-links wheels:"
      Get-ChildItem $links | ForEach-Object { Write-Host "  - $($_.Name)" }

      # Derive the versions from the wheel filenames (single source of truth: the
      # ESRP-signed wheels themselves) so the conda package version can NEVER drift
      # from the wheel. Filenames: mssql_python-<ver>-cp3X-...whl and
      # mssql_python_odbc-<ver>-py3-none-...whl.
      if ($mssqlWheel.Name -notmatch '^mssql_python-([^-]+)-') { Write-Error "Cannot parse version from $($mssqlWheel.Name)"; exit 1 }
      $mssqlVer = $Matches[1]
      if ($odbcWheel.Name -notmatch '^mssql_python_odbc-([^-]+)-') { Write-Error "Cannot parse version from $($odbcWheel.Name)"; exit 1 }
      $odbcVer = $Matches[1]
      Write-Host "Derived versions -> mssql-python=$mssqlVer  mssql-python-odbc=$odbcVer"

      # Build + validate the conda packages for THIS leg's single Python version.
      # 'binding' mode seeds the companion from the ODBC_BuildAll download (splatted
      # only when present) instead of rebuilding it per Python.
      #
      # MUST be a HASHTABLE, not an array: array splatting binds POSITIONALLY, so
      # @('-DriverCondaDir', <dir>) passed '-DriverCondaDir' as a literal value into
      # the first free positional param ($CondaSubdir). That set CONDA_SUBDIR=-DriverCondaDir
      # and conda-build then parsed the platform as '' -> `KeyError: ''`. Hashtable
      # splatting binds by NAME, so -DriverCondaDir is bound to $DriverCondaDir correctly.
      $driverArg = @{}
      if ('${{ parameters.package }}' -eq 'binding') {
        $driverArg = @{ DriverCondaDir = "${{ parameters.driverCondaDownloadDir }}" }
      }
      & "${{ parameters.scriptPath }}" `
        -WheelsDir $links `
        -RecipeRoot "${{ parameters.recipeRoot }}" `
        -OutputDir "${{ parameters.outputDir }}" `
        -MssqlPythonVersion $mssqlVer `
        -OdbcVersion $odbcVer `
        -PythonVersions "${{ parameters.pythonVersion }}" `
        -Package '${{ parameters.package }}' `
        @driverArg
      if ($LASTEXITCODE -ne 0) { Write-Error "conda build+validate failed (exit $LASTEXITCODE)"; exit 1 }

      # Stage the built conda packages onto the leg's artifact so the consolidate
      # stage can collect them (mirrors how the wheels ride the same artifact).
      $condaOut = Join-Path "$(ob_outputDirectory)" 'conda'
      New-Item -ItemType Directory -Force -Path $condaOut | Out-Null
      $built = Get-ChildItem -Path (Join-Path "${{ parameters.outputDir }}" 'bld') -Recurse -Include *.conda, *.tar.bz2 |
        Where-Object { $_.Name -like 'mssql-python*' }
      if (-not $built) { Write-Error "No conda packages were produced under $($links)"; exit 1 }
      foreach ($p in $built) {
        # Preserve the conda subdir folder layout (e.g. win-64/) so the channel
        # is valid when consolidated and indexed downstream.
        $subdir = Split-Path -Leaf (Split-Path -Parent $p.FullName)
        $dest = Join-Path $condaOut $subdir
        New-Item -ItemType Directory -Force -Path $dest | Out-Null
        Copy-Item $p.FullName -Destination $dest -Force
        Write-Host "  staged $subdir/$($p.Name)"
      }
    displayName: 'Conda build + validate (${{ parameters.condaSubdir }} py${{ parameters.pythonVersion }})'
    condition: ne('${{ parameters.targetArch }}', 'arm64')
    continueOnError: ${{ parameters.continueOnError }}
