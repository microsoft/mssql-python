# macOS Single Configuration Stage Template
# Builds Python wheel for a specific Python version (universal2 binary)
# Universal2 = combined x86_64 + ARM64 binary in single .so file
# Tests with Docker-based SQL Server (using Colima as Docker runtime)
parameters:
  # Stage identifier (e.g., 'MacOS_py312')
  - name: stageName
    type: string
  # Job identifier within the stage
  - name: jobName
    type: string
    default: 'BuildWheel'
  # Python version in X.Y format (e.g., '3.12')
  - name: pythonVersion
    type: string
  # Python version as 3-digit string for file naming (e.g., '312')
  - name: shortPyVer
    type: string
  # OneBranch build type: 'Official' (production) or 'NonOfficial' (dev/test)
  - name: oneBranchType
    type: string
    default: 'Official'
  # Phase 2: stages this build depends on (e.g. [ConsolidateOdbc]) so the external
  # mssql-python-odbc wheel exists before pytest. Default [] = no dependency.
  - name: odbcDependsOn
    type: object
    default: []
  # Phase 2: install the external ODBC wheel (from ConsolidateOdbc) before pytest.
  - name: installOdbcWheel
    type: boolean
    default: false
  # Conda: build + validate the osx-arm64 conda package from this leg's wheels.
  # Requires installOdbcWheel (the external odbc wheel is repackaged/solved too).
  - name: buildConda
    type: boolean
    default: false

stages:
  - stage: ${{ parameters.stageName }}
    displayName: 'macOS Py${{ parameters.pythonVersion }} Universal2'
    dependsOn: ${{ parameters.odbcDependsOn }}
    jobs:
      - job: ${{ parameters.jobName }}
        displayName: 'Build Wheel - Py${{ parameters.pythonVersion }} Universal2'
        
        # Pool Configuration
        # macos-latest (currently macOS-15 Sequoia) matches the pr-validation gate
        # (eng/pipelines/pr-validation-pipeline.yml), so the macosx_15_0 universal2
        # wheels this stage builds and install-tests run on the SAME macOS the gate
        # uses -- the release pipeline is no longer a version behind it.
        # type:linux is Azure Pipelines quirk (macOS pools declare as 'linux' type)
        pool:
          type: linux
          isCustom: true
          name: Azure Pipelines
          vmImage: 'macos-latest'
        # 120-minute timeout (universal2 builds take longer due to dual-architecture compilation)
        timeoutInMinutes: 120
        
        # Build Variables
        variables:
          # Disable BinSkim (Windows-focused binary analyzer) - macOS uses Mach-O format, not PE
          - name: ob_sdl_binskim_enabled
            value: false
          # OneBranch artifact output directory
          - name: ob_outputDirectory
            value: '$(Build.ArtifactStagingDirectory)'
          # Linux container image (unused in macOS builds, but required by OneBranch template)
          - name: LinuxContainerImage
            value: 'onebranch.azurecr.io/linux/ubuntu-2204:latest'
          # Python version in X.Y format (e.g., '3.12')
          - name: pythonVersion
            value: ${{ parameters.pythonVersion }}
          # Python version as 3-digit string (e.g., '312') for file naming
          - name: shortPyVer
            value: ${{ parameters.shortPyVer }}
        
        steps:
          # =========================
          # SOURCE CODE CHECKOUT
          # =========================
          # fetchDepth: 0 = full git history (needed for version tagging)
          - checkout: self
            fetchDepth: 0
          
          # =========================
          # PYTHON INSTALLATION
          # =========================
          - task: UsePythonVersion@0
            inputs:
              versionSpec: '${{ parameters.pythonVersion }}'
              addToPath: true
            displayName: 'Use Python ${{ parameters.pythonVersion }}'
            continueOnError: false
          
          # =========================
          # BUILD TOOLS
          # =========================
          # CMake = cross-platform build system generator (needed for C++ compilation)
          # Uninstall first to ensure clean version (avoid conflicts with pre-installed CMake)
          - script: |
              brew update
              brew uninstall cmake --ignore-dependencies || echo "CMake not installed"
              brew install cmake
            displayName: 'Install CMake'
          
          # =========================
          # PYTHON DEPENDENCIES
          # =========================
          # Install build dependencies:
          # - requirements.txt: runtime dependencies (if any)
          # - cmake: CMake Python wrapper
          # - pybind11: C++/Python binding library (headers needed for compilation)
          - script: |
              python --version
              python -m pip --version
              python -m pip install --upgrade pip
              python -m pip install -r requirements.txt
              python -m pip install cmake pybind11
            displayName: 'Install dependencies'
          
          # =========================
          # NATIVE EXTENSION BUILD
          # =========================
          # Build universal2 .so binary (x86_64 + ARM64 in single file)
          # build.sh sets ARCHFLAGS="-arch x86_64 -arch arm64" for clang
          # Output: mssql_python.cpython-3XX-darwin.so (Mach-O universal binary)
          - script: |
              echo "Python Version: ${{ parameters.pythonVersion }}"
              echo "Building Universal2 Binary"
              cd "$(Build.SourcesDirectory)/mssql_python/pybind"
              ./build.sh
            displayName: 'Build .so file'
            continueOnError: false
          
          # Copy native extension to artifact directory for later inspection
          # .so file will be packaged into wheel in later step
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/mssql_python'
              Contents: '*.so'
              TargetFolder: '$(ob_outputDirectory)/bindings/macOS'
            displayName: 'Copy .so files'
          
          # Install Docker CLI and Colima (macOS Docker runtime)
          # Colima = lightweight Docker Desktop alternative using macOS virtualization
          # vz = native macOS virtualization (faster, only works on M1+)
          # qemu = cross-platform emulator (slower, works on Intel Macs)
          # 4 CPU cores + 8GB RAM needed for SQL Server container
          - script: |
              brew update
              brew install docker colima
              colima start --vm-type vz --cpu 4 --memory 8 || {
                echo "vz VM failed, trying qemu..."
                colima start --vm-type qemu --cpu 4 --memory 8
              }
              sleep 30
              docker context use colima >/dev/null || true
              docker version
            displayName: 'Install and start Docker (Colima)'
            timeoutInMinutes: 15
          
          # =========================
          # SQL SERVER CONTAINER
          # =========================
          # Start SQL Server 2022 Docker container for pytest execution
          # macOS uses host networking (localhost:1433) vs Linux uses container IP
          # Container runs in background (-d) and accepts connections on port 1433
          - script: |
              docker pull mcr.microsoft.com/mssql/server:2022-latest
              docker run --name sqlserver \
                -e ACCEPT_EULA=Y \
                -e MSSQL_SA_PASSWORD="${DB_PASSWORD}" \
                -p 1433:1433 -d \
                mcr.microsoft.com/mssql/server:2022-latest
              
              # Wait for SQL Server to accept connections (up to 60 seconds)
              # sqlcmd -C flag = trust server certificate (for TLS connection)
              for i in {1..30}; do
                docker exec sqlserver /opt/mssql-tools18/bin/sqlcmd \
                  -S localhost -U SA -P "$DB_PASSWORD" -C -Q "SELECT 1" && break
                sleep 2
              done
            displayName: 'Start SQL Server (Docker)'
            env:
              DB_PASSWORD: $(DB_PASSWORD)
          
          # =========================
          # MSSQL_PY_CORE INSTALLATION
          # =========================
          # Extract mssql_py_core from NuGet into repo root BEFORE testing
          # Required for bulkcopy tests which use mssql_py_core native bindings
          - script: |
              bash $(Build.SourcesDirectory)/eng/scripts/install-mssql-py-core.sh
            displayName: 'Install mssql_py_core from NuGet'
          
          # =========================
          # PHASE 2: EXTERNAL ODBC DRIVER PACKAGE
          # =========================
          # Phase 2 removed the bundled ODBC driver from the mssql-python wheel, so the
          # driver is resolved from the separate mssql-python-odbc package. Install the
          # matching wheel built earlier in this run (ConsolidateOdbc) before pytest.
          - ${{ if parameters.installOdbcWheel }}:
            - task: DownloadPipelineArtifact@2
              displayName: 'Download consolidated ODBC wheels'
              inputs:
                buildType: 'current'
                artifactName: 'drop_ConsolidateOdbc_ConsolidateArtifacts'
                itemPattern: '**/*.whl'
                targetPath: '$(Pipeline.Workspace)/odbc_wheels'
            - script: |
                set -e
                LINKS=$(dirname "$(find "$(Pipeline.Workspace)/odbc_wheels" -name '*.whl' | head -1)")
                if [ -z "$LINKS" ]; then echo "No ODBC wheel found in downloaded artifact" >&2; exit 1; fi
                echo "Installing mssql-python-odbc from $LINKS"
                python -m pip install --no-index --find-links "$LINKS" mssql-python-odbc
                # The repo checkout ships a committed mssql_python_odbc/ dir whose libs/
                # would SHADOW the just-installed site-packages wheel when pytest runs from
                # the checkout root. Remove it so pytest resolves the driver from the
                # EXTERNAL wheel (mirrors the Linux isolated-install job); otherwise a
                # broken/no-op install would go undetected. setup.py excludes
                # mssql_python_odbc, so the later mssql-python bdist_wheel is unaffected.
                rm -rf "$(Build.SourcesDirectory)/mssql_python_odbc"
                # Assert the driver package now resolves to site-packages, NOT the checkout.
                python -c "import os,mssql_python_odbc as m; p=os.path.realpath(os.path.dirname(m.__file__)); s=os.path.realpath(os.environ['BUILD_SOURCESDIRECTORY']); assert not p.startswith(s), 'mssql_python_odbc resolved inside checkout: '+p; print('mssql_python_odbc resolved from installed wheel:', p)"
              displayName: 'Install external ODBC wheel (mssql-python-odbc)'

          # =========================
          # TESTING
          # =========================
          # Run pytest against SQL Server container
          # Tests use localhost:1433 connection (SA user with password from variable)
          # -v = verbose output (show test names and results)
          - script: |
              python -m pytest -v
            displayName: 'Run pytests'
            env:
              # Connection string uses localhost (SQL Server container exposed on port 1433)
              # TrustServerCertificate=yes bypasses SSL cert validation (test env only)
              DB_CONNECTION_STRING: 'Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DB_PASSWORD);TrustServerCertificate=yes'
          
          # =========================
          # WHEEL BUILD
          # =========================

          # Build wheel package from setup.py
          # Wheel filename: mssql_python-X.Y.Z-cp3XX-cp3XX-macosx_XX_X_universal2.whl
          # bdist_wheel = build binary wheel distribution (contains pre-compiled .so)
          - script: |
              python -m pip install --upgrade pip wheel setuptools
              python setup.py bdist_wheel
            displayName: 'Build wheel package'
          
          # Retag wheel to universal2 — the .so binary is already universal2 (CMake cross-compiles
          # both arm64 + x86_64), but bdist_wheel may tag as x86_64 when the Python interpreter
          # lacks universal2 support (e.g. Python 3.10 from UsePythonVersion@0 is x86_64-only).
          # Same approach used in mssql-tds Rust pipeline (build-python-wheels-template.yml).
          - script: |
              for whl in dist/*.whl; do
                echo "Retagging: $(basename $whl)"
                wheel tags --platform-tag macosx_15_0_universal2 --remove "$whl"
              done
              echo "Wheels after retag:"
              ls -lh dist/
            displayName: 'Ensure universal2 platform tag'

          # =========================
          # STATIC arm64 SLICE AUDIT (osx-arm64 cross-build guardrail)
          # =========================
          # macos-latest is an INTEL Mac agent (the Apple-Silicon macOS image is a
          # paused limited preview), so the osx-arm64 conda package below is CROSS-built
          # and its arm64 runtime CANNOT be executed here. This BLOCKING audit is the
          # stand-in for that missing runtime import: it proves the shipped payload
          # actually contains real arm64 Mach-O slices. A thinned / x86_64-only binary
          # stamped osx-arm64 fails the leg. Same assurance level as the PyPI universal2
          # arm64 slice, which PR-validation (also Intel) likewise only static-checks.
          - ${{ if and(parameters.buildConda, parameters.installOdbcWheel) }}:
            - bash: |
                set -euo pipefail
                fail=0
                echo "--- 1. binding native extension (ddbc_bindings) must carry an arm64 slice ---"
                whl="$(ls "$(Build.SourcesDirectory)"/dist/mssql_python-*.whl 2>/dev/null | grep -v mssql_python_odbc | head -1)"
                [ -n "$whl" ] || { echo "ERROR: no mssql-python wheel in dist/"; exit 1; }
                tmp="$(mktemp -d)"; unzip -oq "$whl" -d "$tmp"
                ext="$(find "$tmp" -name 'ddbc_bindings*.so' | head -1)"
                [ -n "$ext" ] || { echo "ERROR: ddbc_bindings*.so not found in $(basename "$whl")"; exit 1; }
                archs="$(lipo -archs "$ext" 2>/dev/null || true)"
                echo "  $(basename "$ext"): ${archs:-$(file -b "$ext")}"
                if echo "$archs" | grep -qw arm64 || file -b "$ext" | grep -qw arm64; then
                  echo "  OK: ddbc_bindings has an arm64 slice"
                else
                  echo "  ERROR: ddbc_bindings has NO arm64 slice (thinned/x86_64-only) -- refusing to stamp osx-arm64"; fail=1
                fi
                echo "--- 2. companion driver dylibs must be arm64 Mach-O ---"
                odbc="$(find "$(Pipeline.Workspace)/odbc_wheels" -name 'mssql_python_odbc-*macosx*universal2.whl' | head -1)"
                [ -n "$odbc" ] || { echo "ERROR: no macOS odbc wheel under odbc_wheels/"; exit 1; }
                otmp="$(mktemp -d)"; unzip -oq "$odbc" -d "$otmp"
                armdir="$(find "$otmp" -path '*/libs/macos/arm64/lib' -type d | head -1)"
                [ -n "$armdir" ] || { echo "ERROR: libs/macos/arm64/lib not found in odbc wheel"; exit 1; }
                found=0
                for dy in "$armdir"/*.dylib; do
                  [ -e "$dy" ] || continue
                  found=1
                  a="$(lipo -archs "$dy" 2>/dev/null || true)"
                  echo "  $(basename "$dy"): ${a:-$(file -b "$dy")}"
                  if echo "$a" | grep -qw arm64 || file -b "$dy" | grep -qw arm64; then :; else
                    echo "    ERROR: $(basename "$dy") has NO arm64 slice"; fail=1
                  fi
                done
                [ "$found" = 1 ] || { echo "ERROR: no *.dylib under $armdir"; fail=1; }
                [ "$fail" = 0 ] || { echo "STATIC arm64 SLICE AUDIT FAILED"; exit 1; }
                echo "STATIC arm64 SLICE AUDIT PASSED"
              displayName: 'Static arm64 slice audit (osx-arm64 cross-build guardrail)'

          # =========================
          # CONDA PACKAGE (osx-arm64 — CROSS-built on the Intel agent)
          # =========================
          # macos-latest is an Intel Mac (the Apple-Silicon image is a paused preview)
          # and there is no reverse Rosetta, so the arm64 Python cannot run here. We
          # CROSS-build with CONDA_SUBDIR=osx-arm64: conda/*/build.sh extract the
          # universal2 wheel's arm64 slice WITHOUT running Python, and the section-7
          # runtime import auto-skips (the static arm64-slice audit above is the gate).
          # continueOnError makes the runtime import non-fatal on THIS leg only,
          # mirroring the QEMU-emulated linux-aarch64 precedent.
          - ${{ if and(parameters.buildConda, parameters.installOdbcWheel) }}:
            - template: /OneBranchPipelines/steps/conda-build-validate-step-posix.yml@self
              parameters:
                condaSubdir: 'osx-arm64'
                condaTargetSubdir: 'osx-arm64'
                continueOnError: true
                odbcWheelDir: '$(Pipeline.Workspace)/odbc_wheels'
                odbcWheelFilter: 'mssql_python_odbc-*macosx*universal2.whl'
                pythonVersions: ${{ parameters.pythonVersion }}

          # =========================
          # CONDA PACKAGE (osx-64 — NATIVE on the Intel agent)
          # =========================
          # macos-latest is an Intel Mac, so osx-64 is the NATIVE build: conda-build,
          # the verify env's x86_64 Python and the universal2 wheel all run for real
          # here, so the import + DB-less driver-load proof is genuine (BLOCKING). PyPI
          # ships ONE universal2 wheel for both Mac arches; conda has no universal2
          # subdir, so this native osx-64 package plus the cross-built osx-arm64 one
          # above together close the Intel/Apple-Silicon parity gap vs. PyPI.
          - ${{ if and(parameters.buildConda, parameters.installOdbcWheel) }}:
            - template: /OneBranchPipelines/steps/conda-build-validate-step-posix.yml@self
              parameters:
                condaSubdir: 'osx-64'
                condaTargetSubdir: 'osx-64'
                odbcWheelDir: '$(Pipeline.Workspace)/odbc_wheels'
                odbcWheelFilter: 'mssql_python_odbc-*macosx*universal2.whl'
                pythonVersions: ${{ parameters.pythonVersion }}

          # =========================
          # ARTIFACT PUBLISHING
          # =========================
          # Copy wheel to OneBranch output directory
          # dist/ = output directory from setup.py bdist_wheel
          - task: CopyFiles@2
            inputs:
              SourceFolder: '$(Build.SourcesDirectory)/dist'
              Contents: '*.whl'
              TargetFolder: '$(ob_outputDirectory)/wheels'
            displayName: 'Copy wheel files'
          
          # Publish all artifacts (wheels + .so files) for Consolidate stage
          # Artifact naming: drop_<stageName>_<jobName> (OneBranch requirement)
          # Consolidate stage downloads this artifact via 'dependsOn' dependency
          - task: PublishPipelineArtifact@1
            displayName: 'Publish macOS Artifacts'
            inputs:
              targetPath: '$(ob_outputDirectory)'
              artifact: 'drop_${{ parameters.stageName }}_${{ parameters.jobName }}'
              publishLocation: 'pipeline'
          
          # =========================
          # SECURITY SCANNING
          # =========================
          # Component Governance + OneBranch AntiMalware scanning
          # artifactType:'dll' is misnomer - scans all binary files (.so, .dylib, etc.)
          - template: ../steps/malware-scanning-step.yml@self
            parameters:
              scanPath: '$(ob_outputDirectory)'
              artifactType: 'dll'
          
          # ESRP Malware Scanning (Official Builds Only)
          # ESRP = Microsoft's Enterprise Signing and Release Platform
          # Scans wheel files for malware using Microsoft Defender and custom signatures
          # Only runs for Official builds (production compliance requirement)
          - ${{ if eq(parameters.oneBranchType, 'Official') }}:
              - task: EsrpMalwareScanning@5
                displayName: 'ESRP MalwareScanning - Python Wheels (Official)'
                inputs:
                  ConnectedServiceName: '$(SigningEsrpConnectedServiceName)'
                  AppRegistrationClientId: '$(SigningAppRegistrationClientId)'
                  AppRegistrationTenantId: '$(SigningAppRegistrationTenantId)'
                  EsrpClientId: '$(SigningEsrpClientId)'
                  UseMSIAuthentication: true
                  FolderPath: '$(ob_outputDirectory)/wheels'
                  Pattern: '*.whl'  # Scan all wheel files
                  SessionTimeout: 60
                  CleanupTempStorage: 1
                  VerboseLogin: 1
          
          # ESRP Code Signing (DISABLED - wheel files cannot be signed with SignTool)
          # See compound-esrp-code-signing-step.yml for detailed explanation of why this doesn't work
          # - ${{ if eq(parameters.oneBranchType, 'Official') }}:
          #     - template: /OneBranchPipelines/steps/compound-esrp-code-signing-step.yml@self
          #       parameters:
          #         appRegistrationClientId: '$(SigningAppRegistrationClientId)'
          #         appRegistrationTenantId: '$(SigningAppRegistrationTenantId)'
          #         artifactType: 'whl'
          #         authAkvName: '$(SigningAuthAkvName)'
          #         authSignCertName: '$(SigningAuthSignCertName)'
          #         esrpClientId: '$(SigningEsrpClientId)'
          #         esrpConnectedServiceName: '$(SigningEsrpConnectedServiceName)'
          #         signPath: '$(ob_outputDirectory)/wheels'
