---
# N3: PR-triggered conda build + masking-immune RUNPATH audit.
#
# The OneBranch conda-build pipeline is `trigger: none` / `pr: none`, so its blocking
# audit never runs on a PR. This lightweight GitHub Actions job builds ONE real
# linux-64 conda package from the SHIPPED PyPI wheels and runs
# python -m eng.conda_tools elf on it, so a regression in the $ORIGIN climb,
# the declared conda deps (krb5/libtool/openssl), or the expected DT_NEEDED set fails
# the PR automatically -- the full-agent runtime masking cannot hide it.
#
# build.sh ALWAYS stamps the relative $ORIGIN climb onto the vendored Linux ODBC .so
# (they are not code-signed, so the patch breaks no signature; an already-baked climb
# is a byte-for-byte no-op). This gate builds one real linux-64 conda package from the
# shipped PyPI wheels and audits the resulting climb (see conda/mssql-python/build.sh).
name: conda-audit

on:
  pull_request:
    paths:
      - 'conda/**'
      - 'eng/conda_tools/**'
      - 'eng/scripts/download_mssql_python_rs_wheels.py'
      - 'eng/scripts/resolve_nuget_feed.py'
      - 'eng/scripts/mssql_python_build_safety.py'
      - 'eng/versions/mssql-python-rs*.version'
      - 'OneBranchPipelines/conda-build-pipeline.yml'
      - 'OneBranchPipelines/steps/conda-build-validate-step*.yml'
      - 'OneBranchPipelines/jobs/consolidate-conda-artifacts-job.yml'
      - 'OneBranchPipelines/jobs/consolidate-artifacts-job.yml'
      - 'OneBranchPipelines/variables/*.yml'
      - 'OneBranchPipelines/conda-release-pipeline.yml'
      - 'OneBranchPipelines/steps/conda-release-step.yml'
      - 'OneBranchPipelines/steps/conda-publish-step.yml'
      - 'tests/test_027_conda_release_metadata.py'
      - 'tests/test_029_bundled_binary_audit.py'
      - 'tests/test_030_pe_machine_assert.py'
      - 'tests/test_033_driver_load_probe.py'
      - 'tests/test_034_conda_verify_cwd.py'
      - 'tests/test_035_conda_macho_assert.py'
      - 'tests/test_036_conda_provenance.py'
      - 'tests/test_037_rs_wheel_download.py'
      - 'requirements.txt'
      - 'setup.py'
      - 'mssql_python/__init__.py'
      - 'mssql_python_odbc/__init__.py'
      - '.github/workflows/conda-audit.yml'

permissions:
  contents: read

jobs:
  linux-conda-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'

      - name: Unit-test the audit + release validator
        run: |
          python -m pip install --quiet --only-binary=:all: pytest "zstandard==0.23.0"
          # --noconftest: tests/conftest.py imports mssql_python (the native ddbc_bindings
          # extension), which is NOT built in this repackage-only gate. test_027/test_029
          # are pure conda validator/audit tests using only built-in fixtures, so skip
          # conftest to avoid that unrelated import.
          python -m pytest --noconftest \
                           tests/test_029_bundled_binary_audit.py \
                           tests/test_030_pe_machine_assert.py \
                           tests/test_033_driver_load_probe.py \
                           tests/test_034_conda_verify_cwd.py \
                           tests/test_035_conda_macho_assert.py \
                           tests/test_036_conda_provenance.py \
                           tests/test_037_rs_wheel_download.py \
                           tests/test_027_conda_release_metadata.py -q

      - name: Fetch the shipped linux wheels from PyPI
        run: |
          set -euo pipefail
          mkdir -p wheels
          # Exact maintained release versions and PyPI digests, never an older/latest fallback.
          python - <<'PY'
          import email
          import json
          import re
          import subprocess
          import sys
          import urllib.request
          import zipfile
          from pathlib import Path
          from urllib.error import URLError

          from eng.conda_tools.inputs import read_release_versions as read_versions
          versions = read_versions(lambda path: Path(path).read_text(encoding="utf-8"))
          requirements = []
          for name, version in versions.items():
              try:
                  with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=60) as response:
                      release = json.load(response)
              except URLError:
                  raise SystemExit(f"Cannot fetch published {name}=={version} from PyPI; no fallback is allowed.")
              hashes = {item["digests"]["sha256"] for item in release["urls"]
                        if item["packagetype"] == "bdist_wheel" and not item.get("yanked")}
              if (release["info"]["name"] != name or release["info"]["version"] != version
                      or not hashes or any(not re.fullmatch(r"[0-9a-f]{64}", digest) for digest in hashes)):
                  raise SystemExit(f"Invalid published wheel identity or SHA256 for {name}=={version}.")
              requirements.append(f"{name}=={version} " + " ".join(f"--hash=sha256:{digest}" for digest in sorted(hashes)))
          Path("wheel-inputs.txt").write_text("\n".join(requirements) + "\n", encoding="utf-8")
          subprocess.run([sys.executable, "-m", "pip", "--isolated", "download",
                          "--index-url", "https://pypi.org/simple", "--no-deps", "--only-binary=:all:",
                          "--require-hashes", "-r", "wheel-inputs.txt", "-d", "wheels"], check=True)
          wheels = list(Path("wheels").glob("*.whl"))
          if len(wheels) != len(versions):
              raise SystemExit("Expected exactly the binding and ODBC wheels.")
          for name, version in versions.items():
              selected = [path for path in wheels if path.name.startswith(f"{name.replace('-', '_')}-{version}-")]
              if len(selected) != 1:
                  raise SystemExit(f"Missing or ambiguous wheel for {name}=={version}.")
              with zipfile.ZipFile(selected[0]) as archive:
                  metadata_files = [path for path in archive.namelist() if path.endswith(".dist-info/METADATA")]
                  if metadata_files != [f"{name.replace('-', '_')}-{version}.dist-info/METADATA"]:
                      raise SystemExit(f"Expected one matching root METADATA in {selected[0].name}.")
                  metadata = email.message_from_bytes(archive.read(metadata_files[0]))
              names = [re.sub(r"[-_.]+", "-", value).lower() for value in metadata.get_all("Name", [])]
              if names != [name] or metadata.get_all("Version") != [version]:
                  raise SystemExit(f"Wheel METADATA disagrees with {name}=={version}.")
              if name == "mssql-python":
                  pins = [value.strip() for value in metadata.get_all("Requires-Dist", [])
                          if re.match(r"(?i)^mssql[-_.]+python[-_.]+odbc(?:[\s(<=>!~;\[]|$)", value.strip())]
                  exact = rf"==\s*{re.escape(versions['mssql-python-odbc'])}"
                  if len(pins) != 1 or not re.fullmatch(rf"(?i)mssql[-_.]+python[-_.]+odbc\s*(?:{exact}|\({exact}\))", pins[0]):
                      raise SystemExit("Binding METADATA must require exactly the selected ODBC wheel version.")
          PY
          echo "Downloaded:"; ls -1 wheels

      - name: Build + audit a linux-64 conda package
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # One orchestrator runs the same gather + build + masking-immune audit + verify the
          # OneBranch conda leg runs; it derives both wheel versions from the filenames. The
          # find-links dir holds BOTH wheels, so mssql-wheel-dir and odbc-wheel-dir are the same.
          python -m eng.conda_tools build \
            --mssql-wheel-dir "$PWD/wheels" \
            --odbc-wheel-dir "$PWD/wheels" \
            --odbc-wheel-filter "mssql_python_odbc-*.whl" \
            --recipe-root "$PWD/conda" \
            --output-dir "$RUNNER_TEMP/conda-bld" \
            --stage-dir "$RUNNER_TEMP/conda-stage" \
            --conda-subdir "linux-64" \
            --python-versions "3.11"
