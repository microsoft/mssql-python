# =============================================================================
# DRAFT — Conda publish stage for mssql-python + mssql-python-odbc
# =============================================================================
# Status: NOT wired into official-release-pipeline.yml. Integrate ONLY AFTER the
# `microsoft` Anaconda channel onboarding is approved and an org/service-scoped
# ANACONDA_API_TOKEN is provisioned as the 'Anaconda Publishing' variable group.
#
# Mirrors the ODBC-split release discipline:
#   1. Download the SIGNED, consolidated wheels for BOTH packages from build
#      definition 2199 (the same artifacts the PyPI release publishes).
#   2. Build both conda packages by REPACKAGING those signed wheels
#      (--no-index --find-links, never PyPI) via conda-build.
#   3. GATE: test-before-live (local channel install + import + live-connect
#      smoke). Fail the stage if it does not pass — never `|| true` past it.
#   4. Publish BOTH packages together, version-locked, to anaconda.org/microsoft.
#
# NOTE: this single-leg draft builds on a Windows agent. A full rollout builds one
# leg per platform/CPython (mirroring the wheel matrix) so every .conda slice is
# produced on its native agent.
#
# To wire in: add this stage to official-release-pipeline.yml AFTER the
# ReleasePackages (PyPI) stage; add a `publishToConda` boolean parameter, the
# 'Anaconda Publishing' variable group, and — because this stage reads
# $(resources.pipeline.buildPipeline.runID) — a matching `resources: pipelines:`
# block in the ROOT pipeline, e.g.:
#     resources:
#       pipelines:
#         - pipeline: buildPipeline
#           source: <mssql-python build def 2199 pipeline name>
# =============================================================================

parameters:
  - name: publishToConda
    displayName: 'Publish conda packages to microsoft channel'
    type: boolean
    default: false
  - name: mssqlPythonVersion
    type: string
  - name: odbcVersion
    type: string
    default: '18.6.2.1'

stages:
  - stage: PublishConda
    displayName: 'Publish Conda Packages (microsoft channel)'
    dependsOn: ReleasePackages
    condition: and(succeeded(), eq(${{ parameters.publishToConda }}, true))
    jobs:
      - job: BuildTestPublishConda
        displayName: 'Build, test-before-live, and publish conda packages'
        pool:
          type: windows
          isCustom: true
          name: Python-1ES-pool
          demands:
            - imageOverride -equals PYTHON-1ES-MMS2022
        variables:
          - group: 'Anaconda Publishing'   # ANACONDA_API_TOKEN (org/service-scoped)
          - name: ob_outputDirectory
            value: '$(Build.ArtifactStagingDirectory)'
          - name: condaBldDir
            value: '$(Agent.TempDirectory)/conda-bld'
        steps:
          # 1. Download the SIGNED consolidated wheels for BOTH packages (def 2199)
          - task: DownloadPipelineArtifact@2
            displayName: 'Download mssql-python signed wheels'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: 2199
              buildVersionToDownload: 'specific'
              buildId: $(resources.pipeline.buildPipeline.runID)
              artifactName: 'drop_Consolidate_ConsolidateArtifacts'
              targetPath: '$(Build.SourcesDirectory)/artifacts/mssql-python'

          - task: DownloadPipelineArtifact@2
            displayName: 'Download mssql-python-odbc signed wheels'
            inputs:
              buildType: 'specific'
              project: '$(System.TeamProject)'
              definition: 2199
              buildVersionToDownload: 'specific'
              buildId: $(resources.pipeline.buildPipeline.runID)
              artifactName: 'drop_ConsolidateOdbc_ConsolidateArtifacts'
              targetPath: '$(Build.SourcesDirectory)/artifacts/mssql-python-odbc'

          # 2. conda tooling
          - task: PowerShell@2
            displayName: 'Ensure conda-build + anaconda-client'
            inputs:
              targetType: inline
              script: |
                conda install -y -n base conda-build anaconda-client
                if ($LASTEXITCODE -ne 0) { throw "conda tooling install failed" }

          # 3. Build both conda packages from the SIGNED wheels (driver first)
          - task: PowerShell@2
            displayName: 'Build conda packages from signed wheels (--no-index)'
            inputs:
              targetType: inline
              script: |
                $env:CONDA_BLD_PATH = "$(condaBldDir)"
                $odbcDist = "$(Build.SourcesDirectory)/artifacts/mssql-python-odbc/dist"
                $pyDist   = "$(Build.SourcesDirectory)/artifacts/mssql-python/dist"

                # A publish job must NEVER silently fall back to PyPI. Require the signed
                # wheels to be present; fail loudly if either artifact dir has none.
                if (-not (Get-ChildItem $odbcDist -Filter *.whl -ErrorAction SilentlyContinue)) { throw "No mssql-python-odbc wheel in $odbcDist -- refusing to build (would fall back to PyPI)" }
                if (-not (Get-ChildItem $pyDist   -Filter *.whl -ErrorAction SilentlyContinue)) { throw "No mssql-python wheel in $pyDist -- refusing to build (would fall back to PyPI)" }

                # ARTIFACTS_* -> the recipes install offline (--no-index --find-links).
                # MSSQL_*_VERSION -> single source of truth for the package version AND the
                # version-locked companion pin (wired from the stage parameters), so the two
                # literals can never drift.
                $env:ARTIFACTS_ODBC = $odbcDist
                $env:ARTIFACTS_PY   = $pyDist
                $env:MSSQL_PYTHON_VERSION = "${{ parameters.mssqlPythonVersion }}"
                $env:MSSQL_ODBC_VERSION   = "${{ parameters.odbcVersion }}"

                conda build "$(Build.SourcesDirectory)/conda/mssql-python-odbc" --no-test --output-folder "$(condaBldDir)"
                if ($LASTEXITCODE -ne 0) { throw "conda build mssql-python-odbc failed" }
                conda build "$(Build.SourcesDirectory)/conda/mssql-python" --no-test --output-folder "$(condaBldDir)"
                if ($LASTEXITCODE -ne 0) { throw "conda build mssql-python failed" }

          # 4. GATE — test-before-live. Do NOT publish if this fails.
          - task: PowerShell@2
            displayName: 'GATE: install + import + smoke (blocks publish on failure)'
            inputs:
              targetType: inline
              script: |
                conda index "$(condaBldDir)"
                # Mirror the real user install path (-c microsoft): azure-core/azure-identity
                # resolve from the lean `microsoft` channel, NOT conda-forge (whose azure-core
                # recipe over-declares flask/six -> celery/boto3/botocore; see
                # conda-forge/azure-core-feedstock#71). --strict-channel-priority keeps the
                # freshly built companion + binding authoritative over any published build.
                conda create -y -n conda-verify -c "file:///$(condaBldDir)" -c microsoft -c conda-forge --strict-channel-priority --override-channels mssql-python
                if ($LASTEXITCODE -ne 0) { throw "conda-verify env solve failed — companion did not resolve" }
                conda run -n conda-verify python -c "import mssql_python; print('conda import OK', mssql_python.__version__)"
                if ($LASTEXITCODE -ne 0) { throw "conda import failed — BLOCKING publish" }
                # DB-less driver-load proof: importing mssql_python loads the native ODBC
                # driver (std::call_once); the probe additionally attempts a connect to an
                # unreachable port so a *connection* error proves the driver loaded and is
                # arch-correct, while a driver-not-found error fails the gate. This gates on
                # the DRIVER even when DB_CONNECTION_STRING is absent.
                conda run -n conda-verify python "$(Build.SourcesDirectory)/conda/driver_load_probe.py"
                if ($LASTEXITCODE -ne 0) { throw "driver-load proof failed — BLOCKING publish" }
                if ($env:DB_CONNECTION_STRING) {
                  conda run -n conda-verify python -c "import os,mssql_python;c=mssql_python.connect(os.environ['DB_CONNECTION_STRING']);print('SELECT 1 =>',c.cursor().execute('SELECT 1').fetchone())"
                  if ($LASTEXITCODE -ne 0) { throw "conda live-connect smoke failed — BLOCKING publish" }
                }

          # 5. Publish BOTH packages together, version-locked, to microsoft channel
          - task: PowerShell@2
            displayName: 'Publish to anaconda.org/microsoft'
            condition: and(succeeded(), eq(${{ parameters.publishToConda }}, true))
            env:
              ANACONDA_API_TOKEN: $(ANACONDA_API_TOKEN)
            inputs:
              targetType: inline
              script: |
                $pkgs = @(Get-ChildItem -Path "$(condaBldDir)" -Recurse -Include *.conda,*.tar.bz2 |
                          Where-Object { $_.Name -like 'mssql-python*' })
                if (-not $pkgs) { throw "no conda artifacts found to publish" }

                # #706: the companion (mssql-python-odbc) and the binding (mssql-python) must
                # ship TOGETHER. Publish the companion FIRST so the binding's pinned dependency
                # resolves the instant it lands, and refuse to publish a mismatched pair.
                $companion = @($pkgs | Where-Object { $_.Name -like 'mssql-python-odbc-*' })
                $binding   = @($pkgs | Where-Object { $_.Name -like 'mssql-python-*' -and $_.Name -notlike 'mssql-python-odbc-*' })
                if ($companion.Count -eq 0) { throw "no companion (mssql-python-odbc) package to publish" }
                if ($binding.Count   -eq 0) { throw "no binding (mssql-python) package to publish" }
                if ($companion.Count -ne $binding.Count) { throw "#706 violation: $($companion.Count) companion vs $($binding.Count) binding packages -- refusing to publish a mismatched pair" }

                function Publish-One($f) {
                  Write-Host "Uploading $($f.Name)"
                  # --skip-existing makes re-runs idempotent (no --force needed).
                  anaconda --token $env:ANACONDA_API_TOKEN upload --user microsoft --skip-existing "$($f.FullName)"
                  if ($LASTEXITCODE -ne 0) { throw "anaconda upload failed for $($f.Name)" }
                }
                Write-Host "==== publishing companion (mssql-python-odbc) FIRST ===="
                foreach ($p in $companion) { Publish-One $p }
                Write-Host "==== publishing binding (mssql-python) ===="
                foreach ($p in $binding) { Publish-One $p }
                Write-Host "Published $($companion.Count) companion + $($binding.Count) binding conda packages to anaconda.org/microsoft"
