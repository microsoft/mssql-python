{% set version = environ.get('MSSQL_PYTHON_VERSION', '1.13.0') %}
{% set odbc_version = environ.get('MSSQL_ODBC_VERSION', '18.6.2.1') %}

package:
  name: mssql-python
  version: "{{ version }}"

build:
  number: 0
  # Like the companion, this recipe REPACKAGES a prebuilt wheel (the compiled
  # ddbc_bindings extension + bundled runtime); it compiles nothing. conda-build's
  # overlinking/overdepending checks target from-source builds and mis-fire on
  # vendored binaries (e.g. ddbc_bindings linking the driver that lives in the
  # separate companion package), so downgrade both from errors to warnings -- CI
  # enables them as errors by default.
  error_overlinking: false
  error_overdepending: false
  # Like the companion, this recipe vendors PREBUILT, signed binaries (the compiled
  # ddbc_bindings extension + bundled VC++ runtime); conda-build must neither rewrite
  # nor scan them:
  #   - binary_relocation: rewriting RPATH / install-name in a signed binary corrupts
  #     the signature.
  #   - detect_binary_files_with_prefix: the build-prefix scan over the signed native
  #     binaries is meaningless for a pure repackage and is the packaging step that
  #     fails right after "Fixing permissions" on these recipes.
  binary_relocation: false
  detect_binary_files_with_prefix: false
  # WHEELS_DIR is exported by the pipeline (or a local harness) and passed into the
  # isolated conda-build environment so bld.bat / build.sh can install the prebuilt,
  # ESRP-signed wheel from --find-links, fully offline. This mirrors CI: no PyPI.
  script_env:
    - WHEELS_DIR

requirements:
  host:
    - python
    - pip
  run:
    - python
    # No version floor: on the `microsoft` channel azure-identity / azure-core / msal
    # ship as CalVer (e.g. 2026.06.01), so a semver floor like `>=1.12.0` is a
    # misleading no-op there (every published build already satisfies it).
    - azure-identity
    # Version-locked to the companion built alongside this package (issue #706:
    # the driver package is an internal implementation detail; never upgrade it
    # independently of mssql-python).
    - mssql-python-odbc =={{ odbc_version }}
    # conda drops the wheel's platform tag (manylinux_2_28 / macosx_15_0), so
    # re-assert that floor as a virtual-package run constraint. The wheel install
    # in the companion's build already requires these, so this can't be stricter
    # than what actually shipped.
    - __glibc >=2.28      # [linux]
    - __osx >=15.0        # [osx]

test:
  imports:
    - mssql_python

about:
  home: https://github.com/microsoft/mssql-python
  license: MIT
  license_file: ../../LICENSE
  summary: Microsoft driver for Python to interact with SQL Server and Azure SQL.
  description: |
    mssql-python is a DB API 2.0 (PEP 249) compliant driver for SQL Server,
    Azure SQL, and Azure Synapse. The proprietary ODBC Driver 18 payload ships in
    the pinned companion package mssql-python-odbc.

extra:
  recipe-maintainers:
    - jahnvithakkar
