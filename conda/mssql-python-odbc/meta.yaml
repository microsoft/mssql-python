{% set version = environ.get('MSSQL_ODBC_VERSION', '18.6.2.1') %}

package:
  name: mssql-python-odbc
  version: "{{ version }}"

build:
  number: 0
  # This recipe REPACKAGES a prebuilt, ESRP-signed wheel (the proprietary ODBC
  # Driver 18 payload); it compiles nothing. conda-build's post-build overlinking /
  # overdepending analysis targets from-source builds and mis-fires on vendored
  # binaries, so downgrade both from errors to warnings (CI enables them as errors):
  #   - overdepending: the pure-data driver payload doesn't link libpythonX.Y, so
  #     `python` (a legitimate run dep for the importable `mssql_python_odbc` module)
  #     is reported as "unused".
  #   - overlinking: this recipe repackages prebuilt, ESRP-signed dylibs whose
  #     recorded install-name / RPATH references must stay byte-for-byte as signed;
  #     conda-build's overlinking check targets from-source builds and mis-fires on
  #     such vendored binaries.
  error_overlinking: false
  error_overdepending: false
  # This recipe vendors PREBUILT, ESRP-signed binaries (the ODBC Driver 18 payload +
  # the bundled VC++ runtime); conda-build must neither rewrite nor scan them:
  #   - binary_relocation: rewriting RPATH / install-name in a signed binary corrupts
  #     the signature, and the vendored @loader_path / Homebrew-libtool refs must stay
  #     exactly as shipped.
  #   - detect_binary_files_with_prefix: the build-prefix scan over the large signed
  #     DLLs/dylibs is meaningless for a pure repackage (no prefix to relocate at
  #     install time) and is the packaging step that fails right after "Fixing
  #     permissions" on these recipes.
  binary_relocation: false
  detect_binary_files_with_prefix: false
  # macOS builds this recipe for BOTH osx-64 (native on the Intel agent) and
  # osx-arm64 (CROSS-built there). conda-build's .pyc byte-compilation runs the
  # TARGET Python, which for osx-arm64 cannot execute on Intel -- so skip pyc on
  # macOS (Python regenerates it at import). Linux/Windows legs are unaffected.
  skip_compile_pyc:
    - "**/*.py"                # [osx]
  # WHEELS_DIR is exported by the pipeline (or a local harness) and passed into the
  # isolated conda-build environment so bld.bat / build.sh can install the prebuilt,
  # ESRP-signed wheel from --find-links, fully offline. This mirrors CI: no PyPI.
  script_env:
    - WHEELS_DIR

requirements:
  # Windows conda site-packages (`Lib\site-packages`) is NOT Python-version-pathed,
  # so the driver payload is Python-AGNOSTIC there: build with NO `python`/`pip` in
  # host (bld.bat extracts the wheel with `tar`, not pip) so conda-build emits ONE
  # win-* package with no `pyXY` build string -- the exact analog of the PyPI
  # `py3-none-win_*` wheel, built once per platform instead of once per Python.
  # POSIX site-packages IS version-pathed (`lib/pythonX.Y/site-packages`), so there
  # the importable payload stays per-Python (build.sh keeps the pip install).
  host:
    - python                 # [not win]
    - pip                    # [not win]
  run:
    - python
    # --- conda-declared security deps ---------------------------------------
    # The proprietary driver links crypto/auth libraries that MUST receive conda's
    # security updates rather than being frozen into the vendored payload -- mirroring
    # conda-forge libpq, which DECLARES openssl + krb5 instead of vendoring them.
    # (Glue-only libs with no security cadence -- libltdl, the VC++ runtime DLL -- are
    # bundled/handled separately; only crypto/auth is declared here.)
    #
    # OpenSSL: the driver dlopen's libssl/libcrypto for TLS (Encrypt=yes). Because it
    # is dlopen'd (not an ELF NEEDED entry) conda-build's overlinking can't see it, so
    # it must be declared explicitly. Windows uses SChannel, so this is POSIX-only.
    - openssl                 # [not win]
    # Kerberos: libmsodbcsql NEEDs libkrb5.so.3 + libgssapi_krb5.so.2 on Linux. macOS
    # uses the system Kerberos.framework and Windows uses SSPI, so krb5 is Linux-only
    # -- and never vendored (same policy as conda-forge libpq's `krb5 # [not osx]`).
    - krb5                    # [linux]
    # Windows VC++ runtime: msodbcsql18.dll imports VCRUNTIME140.dll, but the vendored
    # vcredist ships only msvcp140.dll. Declare the security-serviced conda runtime so
    # VCRUNTIME140.dll is present (rather than vendoring yet another copy of it).
    - vc14_runtime            # [win]
    # conda drops the wheel's platform tag (manylinux_2_28 / macosx_15_0); re-assert
    # the floor so the proprietary driver payload can't be installed on an
    # unsupported host. The wheel install in this recipe's build already requires
    # these, so the constraint is never stricter than what shipped.
    - __glibc >=2.28      # [linux]
    - __osx >=15.0        # [osx]

test:
  imports:
    - mssql_python_odbc

about:
  home: https://github.com/microsoft/mssql-python
  # Proprietary payload: governed by the Microsoft ODBC Driver 18 EULA (+ the bundled
  # VC++ runtime license), NOT the repo's MIT LICENSE. Ship the actual EULA text.
  license: LicenseRef-Microsoft-Proprietary
  # Vendored copies of mssql_python_odbc/licenses/*.txt (the source of truth). The
  # build pipeline DELETES the checkout `mssql_python_odbc/` before conda-build (the
  # driver must resolve from the installed wheel, not the checkout), so a `../../`
  # reference to those files no longer resolves at package time -- conda-build raises
  # "License file ... does not exist in source root dir or in recipe root dir". Keep
  # the EULA text next to the recipe (which is not deleted) and reference it by name.
  license_file:
    - MICROSOFT_ODBC_DRIVER_FOR_SQL_SERVER_LICENSE.txt
    - MICROSOFT_VISUAL_STUDIO_LICENSE.txt
  summary: Microsoft ODBC Driver 18 payload for mssql-python (companion package).
  description: |
    Internal implementation package for mssql-python. Do NOT install or upgrade
    this package directly; install `mssql-python`, which pins the exact matching
    version of this companion.

extra:
  recipe-maintainers:
    - jahnvithakkar
