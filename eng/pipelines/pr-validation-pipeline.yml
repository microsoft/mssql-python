name: task47285-ubuntu-qemu-upgrade
trigger: none
pr: none
jobs:
- job: HostedUbuntuArm64
  displayName: Task47285 Ubuntu ARM64 full dependencies
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
  - script: python3 eng/scripts/diagnostics/arm64_coverage/hosted.py guard --client test-container-Ubuntu-arm64 --server sqlserver-Ubuntu-arm64
      --python /opt/venv/bin/python --owner "$(Build.BuildId).$(System.JobId)" --distro Ubuntu
    displayName: Verify hosted identity and source
  - script: |
      set -euo pipefail
      # Set up Docker buildx for multi-architecture support
      python3 eng/scripts/diagnostics/arm64_coverage/emulation_setup.py setup --owner "$(Build.BuildId).$(System.JobId)"
      docker buildx create --name multiarch --driver docker-container --use
      docker buildx inspect --bootstrap
    displayName: Setup Docker buildx for ARM64 emulation
  - script: |
      # Create a Docker container for testing on ARM64
      docker run -d --ulimit core=0 --label "com.microsoft.mssql-python.ci-owner=$(Build.BuildId).$(System.JobId)" --name test-container-Ubuntu-arm64 \
        --platform linux/arm64 \
        -v $(Build.SourcesDirectory):/workspace \
        -w /workspace \
        --network bridge \
        ubuntu@sha256:829f6df217bcbae2b371026e81711d1a787c61b2967ad09d015063663ebafbf7 \
        tail -f /dev/null
    displayName: Create Ubuntu ARM64 container
  - script: python3 eng/scripts/diagnostics/arm64_coverage/emulation_setup.py verify --client test-container-Ubuntu-arm64
      --owner "$(Build.BuildId).$(System.JobId)"
    displayName: Verify actual running QEMU binary and guest argv
  - script: |
      python3 eng/scripts/setup_sql_container.py \
        --name "sqlserver-Ubuntu-arm64" --owner "$(Build.BuildId).$(System.JobId)" \
        --image "mcr.microsoft.com/mssql/server:2022-latest" --database TestDB
    displayName: Start SQL Server container for Ubuntu ARM64
    timeoutInMinutes: 22
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - script: |
      # Install dependencies in the ARM64 container
      if [ "Ubuntu" = "Ubuntu" ]; then
        docker exec test-container-Ubuntu-arm64 bash -c "
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export TZ=UTC
          ln -snf /usr/share/zoneinfo/\$TZ /etc/localtime && echo \$TZ > /etc/timezone
          apt-get update
          apt-get install -y python3 python3-pip python3-venv python3-full cmake curl wget gnupg software-properties-common build-essential python3-dev pybind11-dev
          # Verify architecture
          uname -m
          dpkg --print-architecture
          python3 --version
          cmake --version
        "
      else
        # Debian ARM64
        # Python (with pip, venv and dev headers) is already provided by the
        # python:3.11-bookworm base image under /usr/local, so we do NOT
        # apt-install python3* here -- the apt python3 post-install byte-
        # compilation is what SIGSEGVs (exit 139) under QEMU emulation. pybind11
        # comes from pip (requirements.txt); only non-Python build tools are
        # pulled from apt, none of which depend on the Debian python3 package.
        docker exec test-container-Ubuntu-arm64 bash -c "
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          export TZ=UTC
          ln -snf /usr/share/zoneinfo/\$TZ /etc/localtime && echo \$TZ > /etc/timezone
          apt-get update
          apt-get install -y cmake curl wget gnupg build-essential
          # Verify architecture
          uname -m
          dpkg --print-architecture
          python3 --version
          cmake --version
        "
      fi
    displayName: Install basic dependencies in Ubuntu ARM64 container
  - script: "# Install ODBC driver in the ARM64 container\nDRIVER_VERSION=$(awk -F= '/^__version__/ {gsub(/[[:space:]\"]/,\
      \ \"\", $2); print $2; exit}' mssql_python_odbc/__init__.py)\nDRIVER_MAJOR_MINOR=$(echo \"$DRIVER_VERSION\" | cut -d.\
      \ -f1,2)\nif [ -z \"$DRIVER_MAJOR_MINOR\" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__'; exit\
      \ 1; fi\ndocker exec test-container-Ubuntu-arm64 bash -c \"\n  export DEBIAN_FRONTEND=noninteractive\n  \n  # Download\
      \ the package to configure the Microsoft repo\n  if [[ 'Ubuntu' =~ ^Ubuntu ]]; then\n    curl -sSL -O https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb\n\
      \  else\n    # Debian 12\n    curl -sSL -O https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb\n\
      \  fi\n  \n  # Install the package\n  dpkg -i packages-microsoft-prod.deb || true\n  rm packages-microsoft-prod.deb\n\
      \  \n  # Update package list\n  apt-get update\n  \n  # Install the driver (ARM64 version)\n  ACCEPT_EULA=Y apt-get\
      \ install -y msodbcsql18\n  # optional: for bcp and sqlcmd\n  ACCEPT_EULA=Y apt-get install -y mssql-tools18\n  # optional:\
      \ for unixODBC development headers\n  apt-get install -y unixodbc-dev\n\"\n"
    displayName: Install ODBC Driver in Ubuntu ARM64 container
  - script: "# Install Python dependencies in the ARM64 container using virtual environment\ndocker exec test-container-Ubuntu-arm64\
      \ bash -c \"\n  set -euo pipefail\n  # Create a virtual environment\n  python3 -m venv /opt/venv\n  source /opt/venv/bin/activate\n\
      \n  # Ensure the expected runtime tools are available before build/test steps\n  command -v python >/dev/null 2>&1\n\
      \  command -v cmake >/dev/null 2>&1\n  \n  # Install dependencies in the virtual environment\n  python -m pip install\
      \ --upgrade pip\n  python -m pip install -r requirements.txt\n  \n  # Make the virtual environment globally available\n\
      \  echo 'source /opt/venv/bin/activate' >> ~/.bashrc\n\"\n"
    displayName: Install Python dependencies in Ubuntu ARM64 container
  - script: |
      # Build pybind bindings in the ARM64 container
      docker exec test-container-Ubuntu-arm64 bash -c "
        set -euo pipefail
        if [ ! -f /opt/venv/bin/activate ]; then
          echo '/opt/venv/bin/activate is missing. Python dependency setup did not complete.'
          exit 1
        fi
        source /opt/venv/bin/activate
        command -v python >/dev/null 2>&1
        command -v cmake >/dev/null 2>&1
        cd mssql_python/pybind
        chmod +x build.sh
        ./build.sh
      "
    displayName: Build pybind bindings (.so) in Ubuntu ARM64 container
  - template: steps/install-mssql-py-core.yml
    parameters:
      platform: container
      containerName: test-container-Ubuntu-arm64
      venvActivate: source /opt/venv/bin/activate
  - script: |
      # Uninstall ODBC Driver before running tests
      DRIVER_VERSION=$(awk -F= '/^__version__/ {gsub(/[[:space:]"]/, "", $2); print $2; exit}' mssql_python_odbc/__init__.py)
      DRIVER_MAJOR_MINOR=$(echo "$DRIVER_VERSION" | cut -d. -f1,2)
      if [ -z "$DRIVER_MAJOR_MINOR" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__'; exit 1; fi
      docker exec test-container-Ubuntu-arm64 bash -c "
        export DEBIAN_FRONTEND=noninteractive
        apt-get remove --purge -y msodbcsql18 mssql-tools18 unixodbc-dev
        rm -f /usr/bin/sqlcmd
        rm -f /usr/bin/bcp
        rm -rf /opt/microsoft/msodbcsql
        rm -f /lib/aarch64-linux-gnu/libodbcinst.so.2
        odbcinst -u -d -n 'ODBC Driver 11 for SQL Server' || true
        echo 'Uninstalled ODBC Driver and cleaned up libraries'
        echo 'Verifying arm64 debian_ubuntu driver library signatures:'
        ldd mssql_python_odbc/libs/linux/debian_ubuntu/arm64/lib/libmsodbcsql-${DRIVER_MAJOR_MINOR}.so.2.1
      "
    displayName: Uninstall ODBC Driver before running tests in Ubuntu ARM64 container
  - script: python3 eng/scripts/diagnostics/arm64_coverage/hosted.py test --client test-container-Ubuntu-arm64 --server sqlserver-Ubuntu-arm64
      --python /opt/venv/bin/python --owner "$(Build.BuildId).$(System.JobId)" --distro Ubuntu
    displayName: Run exact 44 restored cases with full CI dependencies
    timeoutInMinutes: 17
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - script: python3 eng/scripts/diagnostics/arm64_coverage/hosted.py cleanup --client test-container-Ubuntu-arm64 --server
      sqlserver-Ubuntu-arm64 --python /opt/venv/bin/python --owner "$(Build.BuildId).$(System.JobId)" --distro Ubuntu
    displayName: Clean owned SQL and client; gate public artifacts
    condition: always()
    timeoutInMinutes: 3
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - task: PublishTestResults@2
    condition: and(always(), eq(variables['TASK47285_ARTIFACT_READY'], 'true'), eq(variables['TASK47285_HAS_JUNIT'], 'true'))
    inputs:
      testResultsFiles: $(Agent.TempDirectory)/task47285/public/pytest.xml
      testRunTitle: Task47285 Ubuntu ARM64 unskipped
      failTaskOnFailedTests: true
      failTaskOnMissingResultsFile: true
  - task: PublishPipelineArtifact@1
    condition: and(always(), eq(variables['TASK47285_ARTIFACT_READY'], 'true'))
    inputs:
      targetPath: $(Agent.TempDirectory)/task47285/public
      artifact: task47285-Ubuntu
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 3
