name: ab48086-token-provider-diagnostic
trigger: none
pr: none
jobs:
- job: TokenProvider_ubuntu
  displayName: ubuntu ARM64 QEMU Python 3.10
  pool:
    vmImage: ubuntu-latest
  timeoutInMinutes: 120
  cancelTimeoutInMinutes: 5
  steps:
  - checkout: self
    fetchDepth: 0
    persistCredentials: false
  - script: python3 eng/scripts/diagnostics/token_provider_48086/hosted.py run ubuntu
    displayName: One-attempt owned hosted qualification
    timeoutInMinutes: 113
  - script: python3 eng/scripts/diagnostics/token_provider_48086/hosted.py cleanup ubuntu
    displayName: Always verify owned resource cleanup
    condition: always()
    timeoutInMinutes: 3
  - task: PublishPipelineArtifact@1
    condition: always()
    timeoutInMinutes: 2
    inputs:
      targetPath: $(Agent.TempDirectory)/ab48086-ubuntu/public
      artifact: ab48086-ubuntu
- job: TokenProvider_debian
  displayName: debian ARM64 QEMU Python 3.11
