name: diagnostics-only-native-build-speed
trigger: none
pr: none
variables:
  unixBuildParallelism: '2'
  arm64QemuImage: tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
jobs:
- job: PytestOnMacOS
  displayName: Build-speed diagnostics - macOS x86_64
  timeoutInMinutes: 105
  pool:
    vmImage: macos-latest
  variables:
    DOCKER_CONTEXT: colima
    PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  strategy:
    matrix:
      SQL2022:
        sqlServerImage: mcr.microsoft.com/mssql/server:2022-latest
        sqlVersion: SQL2022
        pythonVersion: '3.13'
      SQL2025:
        sqlServerImage: mcr.microsoft.com/mssql/server:2025-latest
        sqlVersion: SQL2025
        pythonVersion: '3.14'
  steps:
  - checkout: self
    fetchDepth: 2
    persistCredentials: false
  - script: 'set -e

      mkdir -p native-build-results

      git rev-parse HEAD > native-build-results/source.txt

      uname -a > native-build-results/host.txt

      '
    displayName: Initialize bounded build-speed diagnostic artifacts
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true
    displayName: Use Python $(pythonVersion) on macOS
  - task: Cache@2
    inputs:
      key: pip | "$(Agent.OS)" | "$(pythonVersion)" | requirements.txt
      restoreKeys: 'pip | "$(Agent.OS)" | "$(pythonVersion)"

        pip | "$(Agent.OS)"

        '
      path: $(PIP_CACHE_DIR)
    displayName: Cache pip packages
  - script: '# Single serialized Homebrew transaction. brew holds a global lock, so

      # installing cmake, docker, and colima together is both faster than three

      # separate `brew install` calls and lets the next step overlap the Colima

      # VM boot + SQL setup with the Python build.

      # No `brew update` here: the hosted macOS runner ships an up-to-date

      # Homebrew and a full formula re-sync is ~1-3 min of pure setup overhead.

      # Uninstall the preinstalled CMake first to avoid tap conflicts.

      brew uninstall cmake --ignore-dependencies || echo "CMake not installed or already removed"

      brew install cmake docker colima

      '
    displayName: Install build & container tooling (Homebrew)
  - script: "set -e\n# Only SQL lifecycle is retried. Colima starts once, overlapped with the\n# unchanged dependency/native\
      \ build chain. The helper bounds SQL work\n# and redacts output before it reaches this job-private log.\nSQL_LOG=\"\
      $(Agent.TempDirectory)/sql-setup-$(System.JobId).log\"\nSQL_HELPER=\"$(Build.SourcesDirectory)/eng/scripts/setup_sql_container.py\"\
      \nSQL_OWNER=\"$(Build.BuildId).$(System.JobId)\"\nSQL_PID=\nfinish_setup() {\n  status=$?\n  trap - EXIT INT TERM\n\
      \  if [ -n \"$SQL_PID\" ]; then\n    if kill -0 \"$SQL_PID\" 2>/dev/null; then\n      kill -TERM \"$SQL_PID\" || echo\
      \ \"[sql] Background setup already stopped\"\n    fi\n    wait \"$SQL_PID\" || echo \"[sql] Background setup stopped\
      \ or failed\"\n  fi\n  if [ -f \"$SQL_LOG\" ]; then\n    cat \"$SQL_LOG\"\n    rm -f \"$SQL_LOG\"\n  fi\n  if [ \"$status\"\
      \ -ne 0 ]; then\n    python3 \"$SQL_HELPER\" --name sqlserver --owner \"$SQL_OWNER\" --colima --cleanup \\\n      ||\
      \ echo \"[sql] Cleanup failed; final job cleanup will also run\"\n  fi\n  exit \"$status\"\n}\ntrap finish_setup EXIT\n\
      trap 'exit 130' INT\ntrap 'exit 143' TERM\n\necho \"Starting container setup (Colima + SQL Server) in the background...\"\
      \npython3 \"$SQL_HELPER\" --name sqlserver --owner \"$SQL_OWNER\" \\\n  --image \"$(sqlServerImage)\" --colima > \"\
      $SQL_LOG\" 2>&1 &\nSQL_PID=$!\n\necho \"Installing Python dependencies (overlapped with container setup)...\"\npython\
      \ -m pip install --upgrade pip\npip install -r requirements.txt\n\necho \"Building pybind bindings (.so) (overlapped\
      \ with container setup)...\"\npython eng/scripts/diagnostics/native_build_compare.py --output native-build-results\n\
      \necho \"Waiting for container setup (Colima + SQL Server) to finish...\"\nSQL_STATUS=0\nwait \"$SQL_PID\" || SQL_STATUS=$?\n\
      SQL_PID=\nif [ \"$SQL_STATUS\" -ne 0 ]; then\n  exit \"$SQL_STATUS\"\nfi\n"
    displayName: Build + start SQL Server (Colima boot & SQL setup overlapped with build)
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: $(unixBuildParallelism)
      DB_PASSWORD: $(DB_PASSWORD)
      MSSQL_SA_PASSWORD: $(DB_PASSWORD)
      SQLCMDPASSWORD: $(DB_PASSWORD)
    timeoutInMinutes: 75
  - template: steps/install-mssql-py-core.yml
    parameters:
      platform: unix
  - script: "# Uninstall any system/Homebrew ODBC before tests so pytest exercises the\n# driver and driver manager bundled\
      \ in the wheel, not a system copy. Mirrors\n# the Linux jobs. Every command is guarded so this is a no-op when nothing\
      \ is\n# installed (the hosted runner may or may not ship unixODBC).\necho \"Removing Homebrew ODBC packages (if installed)...\"\
      \nbrew uninstall --ignore-dependencies --force msodbcsql18 mssql-tools18 unixodbc 2>/dev/null \\\n  || echo \"  no Homebrew\
      \ ODBC packages to remove\"\n\necho \"Removing leftover driver-manager dylibs and config from Homebrew prefixes...\"\
      \nfor prefix in /opt/homebrew /usr/local; do\n  rm -f \"$prefix\"/lib/libodbc.*.dylib \"$prefix\"/lib/libodbcinst.*.dylib\
      \ \\\n        \"$prefix\"/lib/libodbc.dylib \"$prefix\"/lib/libodbcinst.dylib\n  rm -rf \"$prefix\"/opt/msodbcsql18\
      \ \"$prefix\"/opt/unixodbc\n  rm -f \"$prefix\"/etc/odbcinst.ini \"$prefix\"/etc/odbc.ini\ndone\nrm -f /etc/odbcinst.ini\
      \ /etc/odbc.ini \"$HOME/.odbcinst.ini\" \"$HOME/.odbc.ini\"\n\necho \"Confirming no system unixODBC driver manager remains\
      \ on the default search path:\"\nif ls /opt/homebrew/lib/libodbc.*.dylib /usr/local/lib/libodbc.*.dylib 2>/dev/null;\
      \ then\n  echo \"  WARNING: a system libodbc is still present\"\nelse\n  echo \"  none found (good)\"\nfi\n\necho \"\
      Verifying the bundled x86_64 driver load chain is intact:\"\notool -L mssql_python_odbc/libs/macos/x86_64/lib/libmsodbcsql.18.dylib\
      \ \\\n  || echo \"  bundled driver not found\"\n"
    displayName: Uninstall system ODBC Driver before running tests on macOS
  - script: python3 -c "import hashlib,pathlib,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
      == '7e8d13961dc5e29c02d14a737c31986e878c9db2'; raw=subprocess.check_output(['git','show','HEAD^:eng/pipelines/pr-validation-pipeline.yml']);
      assert hashlib.sha256(raw).hexdigest() == 'e1c6a8730fbfe7b7ce10a463de23d2cd36f8ec17b9da3ef494fead2f9037058c'; pathlib.Path('eng/pipelines/pr-validation-pipeline.yml').write_bytes(raw);
      print('Source-contract tests inspect the exact candidate normal pipeline.')"
    displayName: Restore candidate pipeline for unchanged source-contract tests
  - script: 'echo "Build successful, running tests now"

      python -m pytest -v --junitxml=test-results.xml --cov=. --cov-report=xml --capture=tee-sys --cache-clear

      '
    displayName: Run pytest with coverage
    env:
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DB_PASSWORD);TrustServerCertificate=yes
      DB_PASSWORD: $(DB_PASSWORD)
    timeoutInMinutes: 30
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: '**/test-results.xml'
      testRunTitle: Publish pytest results on macOS $(sqlVersion)
  - script: "python3 eng/scripts/setup_sql_container.py --cleanup --colima \\\n  --name sqlserver --owner \"$(Build.BuildId).$(System.JobId)\"\
      \n"
    displayName: Clean up macOS SQL container
    condition: always()
    timeoutInMinutes: 3
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Retain all planned native-build measurements
    inputs:
      targetPath: $(Build.SourcesDirectory)/native-build-results
      artifact: native-build-macOS-$(sqlVersion)
- job: PytestOnLinux_Alpine_ARM64
  displayName: Build-speed diagnostics - Linux Alpine ARM64
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    fetchDepth: 2
    persistCredentials: false
  - script: 'set -e

      mkdir -p native-build-results

      git rev-parse HEAD > native-build-results/source.txt

      uname -a > native-build-results/host.txt

      '
    displayName: Initialize bounded build-speed diagnostic artifacts
  - script: "set -euo pipefail\n# Set up Docker buildx for multi-architecture support\nif [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64\
      \ ]; then\n  docker run --rm --privileged --platform linux/amd64 \"$(arm64QemuImage)\" --uninstall qemu-aarch64\nfi\n\
      docker run --rm --privileged --platform linux/amd64 \"$(arm64QemuImage)\" --install arm64\ndocker buildx create --name\
      \ multiarch --driver docker-container --use\ndocker buildx inspect --bootstrap\n"
    displayName: Setup Docker buildx for ARM64 emulation
  - script: "# Create a Docker container for testing on ARM64\n# TODO(AB#40901): Temporary pin to 3.22 due to msodbcsql ARM64\
      \ package arch mismatch\n# Revert to alpine:latest once ODBC team releases fixed ARM64 package\ndocker run -d --name\
      \ test-container-alpine-arm64 \\\n  --platform linux/arm64 \\\n  -v $(Build.SourcesDirectory):/workspace \\\n  -w /workspace\
      \ \\\n  --network bridge \\\n  alpine:3.22 \\\n  tail -f /dev/null\n"
    displayName: Create Alpine ARM64 container
  - script: "python3 eng/scripts/setup_sql_container.py \\\n  --name \"sqlserver-alpine-arm64\" --owner \"$(Build.BuildId).$(System.JobId)\"\
      \ \\\n  --image \"mcr.microsoft.com/mssql/server:2022-latest\" --database TestDB\n"
    displayName: Start SQL Server container for Alpine ARM64
    timeoutInMinutes: 22
    env:
      DB_PASSWORD: $(DB_PASSWORD)
      MSSQL_SA_PASSWORD: $(DB_PASSWORD)
      SQLCMDPASSWORD: $(DB_PASSWORD)
  - script: "# Install dependencies in the Alpine ARM64 container\ndocker exec test-container-alpine-arm64 sh -c \"\n  # Update\
      \ package index\n  apk update\n  \n  # Install build tools and system dependencies\n  apk add --no-cache \\\n    build-base\
      \ \\\n    cmake \\\n    clang \\\n    git \\\n    bash \\\n    wget \\\n    curl \\\n    gnupg \\\n    unixodbc \\\n\
      \    unixodbc-dev \\\n    libffi-dev \\\n    openssl-dev \\\n    zlib-dev \\\n    py3-pip \\\n    python3-dev \\\n \
      \   patchelf\n  \n  # Create symlinks for Python compatibility\n  ln -sf python3 /usr/bin/python || true\n  ln -sf pip3\
      \ /usr/bin/pip || true\n  \n  # Verify installation and architecture\n  uname -m\n  python --version\n  which cmake\n\
      \"\n"
    displayName: Install basic dependencies in Alpine ARM64 container
  - script: "# Install ODBC driver in the Alpine ARM64 container\nDRIVER_VERSION=$(awk -F= '/^__version__/ {gsub(/[[:space:]\"\
      ]/, \"\", $2); print $2; exit}' mssql_python_odbc/__init__.py)\nDRIVER_MAJOR_MINOR=$(echo \"$DRIVER_VERSION\" | cut\
      \ -d. -f1,2)\nif [ -z \"$DRIVER_MAJOR_MINOR\" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__'; exit\
      \ 1; fi\ndocker exec test-container-alpine-arm64 bash -c \"\n  # Detect architecture for ODBC driver download\n  case\
      \ \\$(uname -m) in\n    x86_64) architecture='amd64' ;;\n    arm64|aarch64) architecture='arm64' ;;\n    *) architecture='unsupported'\
      \ ;;\n  esac\n  \n  if [[ 'unsupported' == '\\$architecture' ]]; then\n    echo 'Alpine architecture \\$(uname -m) is\
      \ not currently supported.'\n    exit 1\n  fi\n  \n  echo 'Detected architecture: '\\$architecture\n  \n  # Download\
      \ the packages\n  curl -O https://download.microsoft.com/download/0b3d5518-b4a7-4a2b-afc7-7ee9e967f93c/msodbcsql18_18.6.2.1-1_\\\
      $architecture.apk\n  curl -O https://download.microsoft.com/download/7/6d/76de322a-d860-4894-9945-f0cc5d6a45f8/mssql-tools18_18.4.1.1-1_\\\
      $architecture.apk\n  \n  # Download signatures for verification\n  curl -O https://download.microsoft.com/download/0b3d5518-b4a7-4a2b-afc7-7ee9e967f93c/msodbcsql18_18.6.2.1-1_\\\
      $architecture.sig\n  curl -O https://download.microsoft.com/download/7/6d/76de322a-d860-4894-9945-f0cc5d6a45f8/mssql-tools18_18.4.1.1-1_\\\
      $architecture.sig\n  \n  # Import Microsoft GPG key and verify packages\n  curl https://packages.microsoft.com/keys/microsoft.asc\
      \ | gpg --import -\n  gpg --verify msodbcsql18_18.6.2.1-1_\\$architecture.sig msodbcsql18_18.6.2.1-1_\\$architecture.apk\n\
      \  gpg --verify mssql-tools18_18.4.1.1-1_\\$architecture.sig mssql-tools18_18.4.1.1-1_\\$architecture.apk\n  \n  # Install\
      \ the packages\n  apk add --allow-untrusted msodbcsql18_18.6.2.1-1_\\$architecture.apk\n  apk add --allow-untrusted\
      \ mssql-tools18_18.4.1.1-1_\\$architecture.apk\n  \n  # Cleanup\n  rm -f msodbcsql18_18.6.2.1-1_\\$architecture.* mssql-tools18_18.4.1.1-1_\\\
      $architecture.*\n  \n  # Add mssql-tools to PATH\n  export PATH=\\\"\\$PATH:/opt/mssql-tools18/bin\\\"\n  echo 'export\
      \ PATH=\\\"\\$PATH:/opt/mssql-tools18/bin\\\"' >> ~/.bashrc\n\"\n"
    displayName: Install ODBC Driver in Alpine ARM64 container
  - script: "# Install Python dependencies in the Alpine ARM64 container using virtual environment\ndocker exec test-container-alpine-arm64\
      \ bash -c \"\n  # Create virtual environment\n  python -m venv /workspace/venv\n  \n  # Activate virtual environment\
      \ and install dependencies\n  source /workspace/venv/bin/activate\n  \n  # Upgrade pip and install dependencies\n  python\
      \ -m pip install --upgrade pip\n  python -m pip install -r requirements.txt\n  \n  # Verify virtual environment is active\n\
      \  which python\n  which pip\n\"\n"
    displayName: Install Python dependencies in Alpine ARM64 container
  - script: "# Build pybind bindings in the Alpine ARM64 container\ndocker exec -e CMAKE_BUILD_PARALLEL_LEVEL test-container-alpine-arm64\
      \ bash -c \"\n  # Activate virtual environment\n  source /workspace/venv/bin/activate\n  \n  cd mssql_python/pybind\n\
      \  chmod +x build.sh\n  python ../../eng/scripts/diagnostics/native_build_compare.py --output /workspace/native-build-results\n\
      \"\n"
    displayName: Build pybind bindings (.so) in Alpine ARM64 container
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: $(unixBuildParallelism)
    timeoutInMinutes: 75
  - template: steps/install-mssql-py-core.yml
    parameters:
      platform: container
      containerName: test-container-alpine-arm64
      venvActivate: source /workspace/venv/bin/activate
  - script: "# Uninstall ODBC Driver before running tests to use bundled libraries\nDRIVER_VERSION=$(awk -F= '/^__version__/\
      \ {gsub(/[[:space:]\"]/, \"\", $2); print $2; exit}' mssql_python_odbc/__init__.py)\nDRIVER_MAJOR_MINOR=$(echo \"$DRIVER_VERSION\"\
      \ | cut -d. -f1,2)\nif [ -z \"$DRIVER_MAJOR_MINOR\" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__';\
      \ exit 1; fi\ndocker exec test-container-alpine-arm64 bash -c \"\n  # Remove system ODBC installation\n  apk del msodbcsql18\
      \ mssql-tools18 unixodbc-dev || echo 'ODBC packages not installed via apk'\n  rm -f /usr/bin/sqlcmd\n  rm -f /usr/bin/bcp\n\
      \  rm -rf /opt/microsoft/msodbcsql18\n  rm -f /usr/lib/libodbcinst.so.2\n  odbcinst -u -d -n 'ODBC Driver 18 for SQL\
      \ Server' || true\n  echo 'Uninstalled system ODBC Driver and cleaned up libraries'\n  echo 'Verifying arm64 alpine\
      \ driver library signatures:'\n  ldd mssql_python_odbc/libs/linux/alpine/arm64/lib/libmsodbcsql-${DRIVER_MAJOR_MINOR}.so.2.1\
      \ || echo 'Driver library not found'\n\"\n"
    displayName: Uninstall system ODBC Driver before running tests in Alpine ARM64 container
  - script: python3 -c "import hashlib,pathlib,subprocess; assert subprocess.check_output(['git','rev-parse','HEAD^'],text=True).strip()
      == '7e8d13961dc5e29c02d14a737c31986e878c9db2'; raw=subprocess.check_output(['git','show','HEAD^:eng/pipelines/pr-validation-pipeline.yml']);
      assert hashlib.sha256(raw).hexdigest() == 'e1c6a8730fbfe7b7ce10a463de23d2cd36f8ec17b9da3ef494fead2f9037058c'; pathlib.Path('eng/pipelines/pr-validation-pipeline.yml').write_bytes(raw);
      print('Source-contract tests inspect the exact candidate normal pipeline.')"
    displayName: Restore candidate pipeline for unchanged source-contract tests
  - script: "# Run tests in the Alpine ARM64 container\n# Get SQL Server container IP\nSQLSERVER_IP=$(docker inspect sqlserver-alpine-arm64\
      \ --format='{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}')\necho \"SQL Server IP: $SQLSERVER_IP\"\nexport\
      \ DB_CONNECTION_STRING=\"Server=$SQLSERVER_IP;Database=TestDB;Uid=SA;Pwd=$DB_PASSWORD;TrustServerCertificate=yes\"\n\
      \ndocker exec \\\n  -e DB_CONNECTION_STRING \\\n  -e DB_PASSWORD \\\n  test-container-alpine-arm64 bash -c \"\n  echo\
      \ 'Build successful, running tests now on Alpine ARM64'\n  echo 'Architecture:' \\$(uname -m)\n  echo 'Alpine version:'\
      \ \\$(cat /etc/alpine-release)\n  echo 'Using connection string: Server=$SQLSERVER_IP;Database=TestDB;Uid=SA;Pwd=***;TrustServerCertificate=yes'\n\
      \  \n  # Activate virtual environment\n  source /workspace/venv/bin/activate\n\n  # Test basic Python import first\n\
      \  python -c 'import mssql_python; print(\\\"mssql_python imported successfully\\\")'\n  \n  # Run main.py if it exists\n\
      \  if [ -f main.py ]; then\n    echo 'Running main.py...'\n    python main.py\n  fi\n  \n  # Run pytest\n  python -m\
      \ pytest -v --junitxml=test-results-alpine-arm64.xml --cov=. --cov-report=xml:coverage-alpine-arm64.xml --capture=tee-sys\
      \ --cache-clear\n\"\n"
    displayName: Run pytest with coverage in Alpine ARM64 container
    env:
      DB_PASSWORD: $(DB_PASSWORD)
    timeoutInMinutes: 30
  - script: '# Copy test results from container to host

      docker cp test-container-alpine-arm64:/workspace/test-results-alpine-arm64.xml $(Build.SourcesDirectory)/ || echo ''Failed
      to copy test results''

      docker cp test-container-alpine-arm64:/workspace/coverage-alpine-arm64.xml $(Build.SourcesDirectory)/ || echo ''Failed
      to copy coverage results''

      '
    displayName: Copy test results from Alpine ARM64 container
    condition: always()
  - script: "python3 eng/scripts/setup_sql_container.py --cleanup \\\n  --name \"sqlserver-alpine-arm64\" --owner \"$(Build.BuildId).$(System.JobId)\"\
      \n"
    displayName: Clean up sqlserver-alpine-arm64 SQL container
    condition: always()
    timeoutInMinutes: 3
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - script: 'docker stop test-container-alpine-arm64 || true

      docker rm test-container-alpine-arm64 || true

      '
    displayName: Clean up Alpine ARM64 containers
    condition: always()
  - task: PublishTestResults@2
    condition: succeededOrFailed()
    inputs:
      testResultsFiles: '**/test-results-alpine-arm64.xml'
      testRunTitle: Publish pytest results on Alpine ARM64
  - task: PublishPipelineArtifact@1
    condition: always()
    displayName: Retain all planned native-build measurements
    inputs:
      targetPath: $(Build.SourcesDirectory)/native-build-results
      artifact: native-build-Alpine-ARM64
  timeoutInMinutes: 105
