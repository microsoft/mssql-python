name: colima-shared-budget-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

jobs:
- job: MacColimaCutoff
  displayName: 'macOS controlled >600s Colima proof'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 3
  pool:
    vmImage: macos-latest
  strategy:
    matrix:
      SQL2022:
        sqlVersion: '2022'
        pythonVersion: '3.13'
      SQL2025:
        sqlVersion: '2025'
        pythonVersion: '3.14'
  steps:
  - checkout: self
    fetchDepth: 1
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '$(pythonVersion)'
      addToPath: true
  - script: |
      set -eu
      if ! command -v docker >/dev/null || ! command -v colima >/dev/null; then
        brew install docker colima
      fi
      docker --version
      colima version
      limactl --version
      uname -srm
      python3 --version
      python3 -c "import sys; assert '.'.join(map(str, sys.version_info[:2])) == '$(pythonVersion)'"
    displayName: 'Ensure matching macOS tooling and Python'
    timeoutInMinutes: 10
  - script: |
      set -eu
      git rev-parse HEAD
      python3 eng/scripts/diagnostics/cutoff/real_sql_recovery.py \
        --helper eng/scripts/setup_sql_container.py \
        --work-dir "$DIAG_WORK_DIR" --owner "$DIAG_OWNER" \
        --colima --sql-version "$(sqlVersion)"
    displayName: 'Prove controlled delay, SQL identity, recovery and failure gates'
    timeoutInMinutes: 48
    env:
      DIAG_WORK_DIR: $(Agent.TempDirectory)/colima-cutoff-$(System.JobId)
      DIAG_OWNER: $(Build.BuildId).$(System.JobId)
