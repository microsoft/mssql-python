name: isolated-rootcause-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none
parameters:
- name: runMac
  type: boolean
  default: true
- name: runWindows
  type: boolean
  default: false
jobs:
- job: MacTimingDiagnostics
  displayName: Isolated macOS timing diagnostics
  timeoutInMinutes: 90
  pool:
    vmImage: macos-latest
  variables:
    PIP_CACHE_DIR: $(Pipeline.Workspace)/.pip-cache
  strategy:
    matrix:
      SQL2022:
        sqlServerImage: mcr.microsoft.com/mssql/server:2022-latest
        sqlVersion: SQL2022
        pythonVersion: '3.13'
      SQL2025:
        sqlServerImage: mcr.microsoft.com/mssql/server:2025-latest
        sqlVersion: SQL2025
        pythonVersion: '3.14'
  steps:
  - task: UsePythonVersion@0
    inputs:
      versionSpec: $(pythonVersion)
      addToPath: true
    displayName: Use Python $(pythonVersion) on macOS
    timeoutInMinutes: 15
  - script: 'set -e

      mkdir -p "$DIAG_OUTPUT"

      python -c ''import secrets; print("##vso[task.setvariable variable=DIAG_DB_PASSWORD;issecret=true]Diag7!"
      + secrets.token_hex(24))''

      git rev-parse HEAD

      python --version

      uname -a

      '
    displayName: Initialize isolated diagnostics and ephemeral SQL credential
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
  - task: Cache@2
    inputs:
      key: pip | "$(Agent.OS)" | "$(pythonVersion)" | requirements.txt
      restoreKeys: 'pip | "$(Agent.OS)" | "$(pythonVersion)"

        pip | "$(Agent.OS)"

        '
      path: $(PIP_CACHE_DIR)
    displayName: Cache pip packages
    timeoutInMinutes: 15
  - script: '# Single serialized Homebrew transaction. brew holds a global lock, so

      # installing cmake, docker, and colima together is both faster than three

      # separate `brew install` calls and lets the next step overlap the Colima

      # VM boot + SQL setup with the Python build.

      # No `brew update` here: the hosted macOS runner ships an up-to-date

      # Homebrew and a full formula re-sync is ~1-3 min of pure setup overhead.

      # Uninstall the preinstalled CMake first to avoid tap conflicts.

      brew uninstall cmake --ignore-dependencies || echo "CMake not installed or already removed"

      brew install cmake docker colima

      '
    displayName: Install build & container tooling (Homebrew)
    timeoutInMinutes: 15
  - script: "set -e\n# Overlap the ENTIRE container-side setup (Colima VM boot -> image pull ->\n# container start\
      \ -> SQL readiness) with the CPU-bound Python setup (pip\n# install + pybind build). The two chains are independent\
      \ until pytest, so\n# we run the container chain in the background and the build in the\n# foreground, then\
      \ wait for the container before continuing.\n#\n# On the Intel macOS-15 hosted runner the linux/amd64 SQL\
      \ Server image runs\n# natively (no emulation); the dominant container costs are the Colima VM\n# boot (~2-4\
      \ min) and the ~2 GB image pull, both of which are hidden behind\n# the build here.\n#\n# NOTE: this deliberately\
      \ merges what used to be separate steps (start\n# Colima, pull+start SQL, install Python deps, build pybind).\
      \ Splitting them\n# back out restores the previous per-step timing breakdown.\nsetup_sql() {\n  echo \"[sql]\
      \ Starting Colima VM...\"\n  colima start --cpu 4 --memory 8 --disk 50\n  docker context use colima >/dev/null\
      \ || true\n  docker version\n\n  echo \"[sql] Pulling SQL Server image...\"\n  docker pull \"$(sqlServerImage)\"\
      \n\n  echo \"[sql] Starting SQL Server container...\"\n  docker run \\\n    --name sqlserver \\\n    -e ACCEPT_EULA=Y\
      \ \\\n    -e MSSQL_SA_PASSWORD=\"${DB_PASSWORD}\" \\\n    -p 1433:1433 \\\n    -d \"$(sqlServerImage)\"\n\n\
      \  echo \"[sql] Waiting for SQL Server to accept connections...\"\n  for i in {1..30}; do\n    if docker exec\
      \ sqlserver \\\n      /opt/mssql-tools18/bin/sqlcmd \\\n      -S localhost -U SA -P \"$DB_PASSWORD\" \\\n\
      \      -C -Q \"SELECT 1\"; then\n      echo \"[sql] SQL Server is ready.\"\n      return 0\n    fi\n    sleep\
      \ 2\n  done\n\n  # One last probe: the loop sleeps after its final attempt, so SQL can\n  # become reachable\
      \ in that window and would otherwise be missed.\n  if docker exec sqlserver \\\n    /opt/mssql-tools18/bin/sqlcmd\
      \ \\\n    -S localhost -U SA -P \"$DB_PASSWORD\" \\\n    -C -Q \"SELECT 1\"; then\n    echo \"[sql] SQL Server\
      \ is ready.\"\n    return 0\n  fi\n\n  # sqlcmd only reports that the client could not connect. When the\n\
      \  # container itself exited (bad password policy, EULA, OOM, port clash)\n  # the reason is in the container's\
      \ own log, so surface it here.\n  echo \"[sql] SQL Server did not become ready in time.\" >&2\n  echo \"[sql]\
      \ ---- docker logs sqlserver (last 200 lines) ----\" >&2\n  docker logs --tail 200 sqlserver >&2 || true\n\
      \  return 1\n}\n\necho \"Starting container setup (Colima + SQL Server) in the background...\"\nsetup_sql\
      \ > /tmp/sql_setup.log 2>&1 &\nSQL_PID=$!\n\necho \"Installing Python dependencies (overlapped with container\
      \ setup)...\"\npython -m pip install --upgrade pip\npip install -r requirements.txt\n\necho \"Building pybind\
      \ bindings (.so) (overlapped with container setup)...\"\n( cd mssql_python/pybind && ./build.sh )\n\necho\
      \ \"Waiting for container setup (Colima + SQL Server) to finish...\"\nif ! wait \"$SQL_PID\"; then\n  echo\
      \ \"Container setup failed:\"\n  cat /tmp/sql_setup.log\n  exit 1\nfi\ncat /tmp/sql_setup.log\n"
    displayName: Build + start SQL Server (Colima boot & SQL setup overlapped with build)
    env:
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
    timeoutInMinutes: 30
  - template: steps/install-mssql-py-core.yml
    parameters:
      platform: unix
  - script: "# Uninstall any system/Homebrew ODBC before tests so pytest exercises the\n# driver and driver manager\
      \ bundled in the wheel, not a system copy. Mirrors\n# the Linux jobs. Every command is guarded so this is\
      \ a no-op when nothing is\n# installed (the hosted runner may or may not ship unixODBC).\necho \"Removing\
      \ Homebrew ODBC packages (if installed)...\"\nbrew uninstall --ignore-dependencies --force msodbcsql18 mssql-tools18\
      \ unixodbc 2>/dev/null \\\n  || echo \"  no Homebrew ODBC packages to remove\"\n\necho \"Removing leftover\
      \ driver-manager dylibs and config from Homebrew prefixes...\"\nfor prefix in /opt/homebrew /usr/local; do\n\
      \  rm -f \"$prefix\"/lib/libodbc.*.dylib \"$prefix\"/lib/libodbcinst.*.dylib \\\n        \"$prefix\"/lib/libodbc.dylib\
      \ \"$prefix\"/lib/libodbcinst.dylib\n  rm -rf \"$prefix\"/opt/msodbcsql18 \"$prefix\"/opt/unixodbc\n  rm -f\
      \ \"$prefix\"/etc/odbcinst.ini \"$prefix\"/etc/odbc.ini\ndone\nrm -f /etc/odbcinst.ini /etc/odbc.ini \"$HOME/.odbcinst.ini\"\
      \ \"$HOME/.odbc.ini\"\n\necho \"Confirming no system unixODBC driver manager remains on the default search\
      \ path:\"\nif ls /opt/homebrew/lib/libodbc.*.dylib /usr/local/lib/libodbc.*.dylib 2>/dev/null; then\n  echo\
      \ \"  WARNING: a system libodbc is still present\"\nelse\n  echo \"  none found (good)\"\nfi\n\necho \"Verifying\
      \ the bundled x86_64 driver load chain is intact:\"\notool -L mssql_python_odbc/libs/macos/x86_64/lib/libmsodbcsql.18.dylib\
      \ \\\n  || echo \"  bundled driver not found\"\n"
    displayName: Uninstall system ODBC Driver before running tests on macOS
    timeoutInMinutes: 15
  - script: 'set -e

      python -c "import mssql_python; print(''Native module loaded'')"

      docker exec -e SQLCMDPASSWORD="$DB_PASSWORD" sqlserver /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -C
      -b -l 10 -Q "SELECT 1"

      echo "##vso[task.setvariable variable=DIAG_READY]true"

      '
    displayName: Confirm diagnostic prerequisites
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    timeoutInMinutes: 3
  - script: python eng/scripts/diagnostics/macos_diagnostic.py suite
    displayName: 'Diagnostic suite: original source and client/server timing'
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: and(succeededOrFailed(), eq(variables['DIAG_READY'], 'true'))
    timeoutInMinutes: 22
  - script: python eng/scripts/diagnostics/macos_diagnostic.py targeted
    displayName: 'Diagnostic targeted: original source and client/server timing'
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: and(succeededOrFailed(), eq(variables['DIAG_READY'], 'true'))
    timeoutInMinutes: 12
  - script: python eng/scripts/diagnostics/macos_diagnostic.py probe
    displayName: 'Diagnostic probe: original source and client/server timing'
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: and(succeededOrFailed(), eq(variables['DIAG_READY'], 'true'))
    timeoutInMinutes: 8
  - script: 'set -e

      brew tap microsoft/mssql-release https://github.com/Microsoft/homebrew-mssql-release

      HOMEBREW_ACCEPT_EULA=Y ACCEPT_EULA=Y brew install msodbcsql18

      python -m pip install pyodbc

      odbcinst -q -d

      python -c "import pyodbc; print(''pyodbc'', pyodbc.version, pyodbc.drivers())"

      echo "##vso[task.setvariable variable=CONTROL_READY]true"

      '
    displayName: Install existing benchmark ODBC control
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: and(succeededOrFailed(), eq(variables['DIAG_READY'], 'true'))
    timeoutInMinutes: 10
  - script: python eng/scripts/diagnostics/macos_diagnostic.py control
    displayName: Diagnostic pyodbc timing control
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: and(succeededOrFailed(), eq(variables['CONTROL_READY'], 'true'))
    timeoutInMinutes: 5
  - script: python eng/scripts/diagnostics/macos_diagnostic.py snapshot
    displayName: Capture final SQL and host state
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: always()
    timeoutInMinutes: 4
  - script: "python - <<'PY'\nimport os\nfrom pathlib import Path\nroot = Path(os.environ[\"DIAG_OUTPUT\"])\nfor\
      \ path in root.rglob(\"*\"):\n    if path.is_file():\n        if path.suffix not in {\".jsonl\", \".json\"\
      , \".log\", \".xml\", \".txt\"}:\n            raise RuntimeError(\"Unexpected non-text artifact: \" + path.name)\n\
      \        text = path.read_text(encoding=\"utf-8\", errors=\"replace\")\n        path.write_text(text.replace(os.environ[\"\
      DB_PASSWORD\"], \"[REDACTED]\"), encoding=\"utf-8\")\nprint(\"##vso[task.setvariable variable=DIAG_REDACTED]true\"\
      )\nPY\n"
    displayName: Redact text diagnostics before publication
    env:
      DIAG_OUTPUT: $(Build.ArtifactStagingDirectory)/rootcause
      DB_PASSWORD: $(DIAG_DB_PASSWORD)
      DB_CONNECTION_STRING: Server=tcp:127.0.0.1,1433;Database=master;Uid=SA;Pwd=$(DIAG_DB_PASSWORD);TrustServerCertificate=yes
      PYTHONPATH: $(Build.SourcesDirectory)
      PYTHONFAULTHANDLER: '1'
    condition: always()
    timeoutInMinutes: 3
  - task: PublishPipelineArtifact@1
    displayName: Publish redacted diagnostic text only
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/rootcause
      artifact: diagnostic-macOS-$(sqlVersion)
    condition: and(always(), eq(variables['DIAG_REDACTED'], 'true'))
  condition: eq(${{ parameters.runMac }}, true)
