name: sql-setup-recovery-$(Date:yyyyMMdd)$(Rev:.r)
trigger: none
pr: none

jobs:
- job: LinuxSqlRecovery
  displayName: 'Isolated Linux SQL2025 recovery proof'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 3
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    fetchDepth: 1
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.14'
      addToPath: true
  - script: |
      set -eu
      git rev-parse HEAD
      python3 --version
      docker version
      python3 eng/scripts/diagnostics/real_sql_recovery.py \
        --helper eng/scripts/setup_sql_container.py \
        --work-dir "$DIAG_WORK_DIR" --owner "$DIAG_OWNER"
    displayName: 'Prove clean startup, one recovery, and permanent failure'
    timeoutInMinutes: 55
    env:
      DIAG_WORK_DIR: $(Agent.TempDirectory)/sql-recovery-$(System.JobId)
      DIAG_OWNER: $(Build.BuildId).$(System.JobId)

- job: MacSqlRecovery
  displayName: 'Isolated macOS SQL2025 recovery proof'
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 3
  pool:
    vmImage: macos-latest
  steps:
  - checkout: self
    fetchDepth: 1
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.14'
      addToPath: true
  - script: |
      set -eu
      if ! command -v docker >/dev/null || ! command -v colima >/dev/null; then
        brew install docker colima
      fi
      docker --version
      colima version
    displayName: 'Ensure Docker and Colima tooling'
    timeoutInMinutes: 10
  - script: |
      set -eu
      git rev-parse HEAD
      python3 --version
      uname -a
      python3 eng/scripts/diagnostics/real_sql_recovery.py \
        --helper eng/scripts/setup_sql_container.py \
        --work-dir "$DIAG_WORK_DIR" --owner "$DIAG_OWNER" --colima
    displayName: 'Prove clean startup, one recovery, and permanent failure'
    timeoutInMinutes: 48
    env:
      DIAG_WORK_DIR: $(Agent.TempDirectory)/sql-recovery-$(System.JobId)
      DIAG_OWNER: $(Build.BuildId).$(System.JobId)
