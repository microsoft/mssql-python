- job: HostedRhelArm64
  displayName: Task47285 rhel9 ARM64 full dependencies
  pool:
    vmImage: ubuntu-latest
  steps:
  - checkout: self
    clean: true
    fetchDepth: 1
  - script: python3 eng/scripts/diagnostics/arm64_coverage/hosted.py guard --client test-container-rhel9-arm64 --server sqlserver-rhel9-arm64
      --python /workspace/myvenv/bin/python --owner "$(Build.BuildId).$(System.JobId)" --distro rhel9
    displayName: Verify hosted identity and source
  - script: |
      # Set up Docker buildx for multi-architecture support
      docker run --rm --privileged multiarch/qemu-user-static@sha256:fe60359c92e86a43cc87b3d906006245f77bfc0565676b80004cc666e4feb9f0 --reset -p yes
      docker buildx create --name multiarch --driver docker-container --use
      docker buildx inspect --bootstrap
    displayName: Setup Docker buildx for ARM64 emulation
  - script: |
      # Create a Docker container for testing on ARM64
      docker run -d --ulimit core=0 --label "com.microsoft.mssql-python.ci-owner=$(Build.BuildId).$(System.JobId)" --name test-container-rhel9-arm64 \
        --platform linux/arm64 \
        -v $(Build.SourcesDirectory):/workspace \
        -w /workspace \
        --network bridge \
        redhat/ubi9:latest \
        tail -f /dev/null
    displayName: Create RHEL 9 ARM64 container
  - script: |
      python3 eng/scripts/setup_sql_container.py \
        --name "sqlserver-rhel9-arm64" --owner "$(Build.BuildId).$(System.JobId)" \
        --image "mcr.microsoft.com/mssql/server:2022-latest" --database TestDB
    displayName: Start SQL Server container for RHEL 9 ARM64
    timeoutInMinutes: 22
    env:
      DB_PASSWORD: $(DB_PASSWORD)
  - script: "# Install dependencies in the RHEL 9 ARM64 container\nDRIVER_VERSION=$(awk -F= '/^__version__/ {gsub(/[[:space:]\"\
      ]/, \"\", $2); print $2; exit}' mssql_python_odbc/__init__.py)\nDRIVER_MAJOR_MINOR=$(echo \"$DRIVER_VERSION\" | cut\
      \ -d. -f1,2)\nif [ -z \"$DRIVER_MAJOR_MINOR\" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__'; exit\
      \ 1; fi\ndocker exec test-container-rhel9-arm64 bash -c \"\n  # Enable CodeReady Builder repository for additional packages\n\
      \  dnf update -y\n  dnf install -y https://dl.fedoraproject.org/pub/epel/epel-release-latest-9.noarch.rpm\n  subscription-manager\
      \ repos --enable codeready-builder-for-rhel-9-$(arch)-rpms || dnf config-manager --set-enabled ubi-9-codeready-builder\n\
      \  \n  # Install Python 3.12 (available in RHEL 9.4+) and development tools\n  # Note: curl and wget omitted to avoid\
      \ conflicts with curl-minimal\n  dnf install -y python3.12 python3.12-pip python3.12-devel python3.12-libs gnupg2 glibc-devel\
      \ kernel-headers\n  dnf install -y gcc gcc-c++ make binutils cmake\n  # If that doesn't work, try installing from different\
      \ repositories\n  if ! which gcc; then\n    echo 'Trying alternative gcc installation...'\n    dnf --enablerepo=ubi-9-codeready-builder\
      \ install -y gcc gcc-c++\n  fi\n  # Verify installation and architecture\n  python3.12 --version\n  which gcc && which\
      \ g++\n  gcc --version\n  g++ --version\n  uname -m\n  echo 'Architecture:' \\$(uname -m)\n\"\n"
    displayName: Install basic dependencies in RHEL 9 ARM64 container
  - script: "# Verify compiler installation and set environment for RHEL 9 ARM64\ndocker exec test-container-rhel9-arm64 bash\
      \ -c \"\n  # Verify compilers are available\n  which gcc || echo 'GCC not found'\n  which g++ || echo 'G++ not found'\n\
      \  gcc --version || echo 'GCC version check failed'\n  g++ --version || echo 'G++ version check failed'\n  \n  # Set\
      \ compiler environment variables\n  export CC=/usr/bin/gcc\n  export CXX=/usr/bin/g++\n  echo 'CC set to:' \\$CC\n \
      \ echo 'CXX set to:' \\$CXX\n  echo 'Running on architecture:' \\$(uname -m)\n  \n  # Create a wrapper script to preserve\
      \ environment\n  cat > /workspace/setup_env.sh << 'EOF'\n  #!/bin/bash\n  export CC=/usr/bin/gcc\n  export CXX=/usr/bin/g++\n\
      \  export PATH=/usr/bin:\\$PATH\n  exec \\\"\\$@\\\"\n  EOF\n  chmod +x /workspace/setup_env.sh\n\"\n"
    displayName: Verify and configure compilers in RHEL 9 ARM64 container
  - script: "# Install ODBC driver in the RHEL 9 ARM64 container\ndocker exec test-container-rhel9-arm64 bash -c \"\n  # Add\
      \ Microsoft repository for RHEL 9\n  curl -sSL -o /etc/yum.repos.d/msprod.repo https://packages.microsoft.com/config/rhel/9/prod.repo\n\
      \  \n  # Install the driver (ARM64 version)\n  ACCEPT_EULA=Y dnf install -y msodbcsql18\n  # optional: for bcp and sqlcmd\n\
      \  ACCEPT_EULA=Y dnf install -y mssql-tools18\n  # optional: for unixODBC development headers\n  dnf install -y unixODBC-devel\n\
      \"\n"
    displayName: Install ODBC Driver in RHEL 9 ARM64 container
  - script: "# Install Python dependencies in the container using virtual environment\ndocker exec test-container-rhel9-arm64\
      \ bash -c \"\n  # Create a virtual environment with Python 3.12\n  python3.12 -m venv myvenv\n  source myvenv/bin/activate\n\
      \n  # Install dependencies in the virtual environment\n  python -m pip install --upgrade pip\n  python -m pip install\
      \ -r requirements.txt\n  \n  # Make the virtual environment globally available\n  echo 'source myvenv/bin/activate'\
      \ >> ~/.bashrc\n\"\n"
    displayName: Install Python dependencies in RHEL 9 ARM64 container
  - script: |
      # Build pybind bindings in the ARM64 container
      docker exec test-container-rhel9-arm64 bash -c "
        source myvenv/bin/activate
        ls /usr/include/python3.12
        # Set compiler environment variables
        export CC=/usr/bin/gcc
        export CXX=/usr/bin/g++

        cd mssql_python/pybind
        chmod +x build.sh
        ./build.sh
      "
    displayName: Build pybind bindings (.so) in RHEL 9 ARM64 container
  - template: steps/install-mssql-py-core.yml
    parameters:
      platform: container
      containerName: test-container-rhel9-arm64
      venvActivate: source myvenv/bin/activate
  - script: |
      # Uninstall ODBC Driver before running tests
      DRIVER_VERSION=$(awk -F= '/^__version__/ {gsub(/[[:space:]"]/, "", $2); print $2; exit}' mssql_python_odbc/__init__.py)
      DRIVER_MAJOR_MINOR=$(echo "$DRIVER_VERSION" | cut -d. -f1,2)
      if [ -z "$DRIVER_MAJOR_MINOR" ]; then echo 'Error: failed to parse mssql_python_odbc.__version__'; exit 1; fi
      docker exec test-container-rhel9-arm64 bash -c "
        dnf remove -y msodbcsql18 mssql-tools18 unixODBC-devel
        rm -f /usr/bin/sqlcmd
        rm -f /usr/bin/bcp
