trigger: none
pr: none

jobs:
- job: windows_shutdown_acceptance
  displayName: Windows shutdown acceptance
  timeoutInMinutes: 60
  cancelTimeoutInMinutes: 3
  pool:
    vmImage: windows-2025
  strategy:
    maxParallel: 2
    matrix:
      SQL2022_Py313:
        sqlVersion: SQL2022
        pythonVersion: '3.13.15'
      SQL2025_Py314:
        sqlVersion: SQL2025
        pythonVersion: '3.14.7'
  variables:
    DiagnosticRoot: '$(Build.SourcesDirectory)\eng\diagnostics\windows-shutdown'
    PrivateRoot: '$(Agent.TempDirectory)\shutdown-private-$(System.JobId)'
    PublishRoot: '$(Agent.TempDirectory)\shutdown-publish-$(System.JobId)'
    SHUTDOWN_ARTIFACTS_SAFE: 'false'
  steps:
  - powershell: |
      New-Item -ItemType Directory -Path "$(PrivateRoot)", "$(PublishRoot)" -Force | Out-Null
      @{ work_deadline_unix_ms = [DateTimeOffset]::UtcNow.AddMinutes(54).ToUnixTimeMilliseconds() } |
        ConvertTo-Json | Set-Content -LiteralPath "$(PrivateRoot)\control.json" -Encoding UTF8
      @{ kind = 'expected-acceptance-contract'; expected_debug_test_children = 700; sqlVersion = '$(sqlVersion)' } |
        ConvertTo-Json | Set-Content -LiteralPath "$(PublishRoot)\job.json" -Encoding UTF8
    displayName: Initialize one global deadline and isolated output directories
  - checkout: self
    clean: true
    fetchDepth: 0
    persistCredentials: false
    timeoutInMinutes: 5
  - task: UsePythonVersion@0
    timeoutInMinutes: 3
    inputs:
      versionSpec: '$(pythonVersion)'
      architecture: x64
      addToPath: true
  - script: |
      python -m pip install -r requirements.txt pybind11==3.1.0 pytest==9.1.1
    timeoutInMinutes: 5
    displayName: Install existing test/build dependencies with matched pybind11 and pytest
  - powershell: |
      & $env:ComSpec /d /c 'powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$(DiagnosticRoot)\setup_hosted.ps1" -SqlVersion "$(sqlVersion)" -PrivateRoot "$(PrivateRoot)" -PublishRoot "$(PublishRoot)" > "$(PrivateRoot)\setup.stdout.raw.log" 2> "$(PrivateRoot)\setup.stderr.raw.log"'
      if ($LASTEXITCODE -ne 0) { throw 'Bounded SQL setup failed; raw output is private until redaction.' }
    timeoutInMinutes: 20
    displayName: Install and verify requested SQL Express engine and isolated database
  - task: PowerShell@2
    timeoutInMinutes: 5
    displayName: Verify approved source bytes and build symbolized native artifacts
    inputs:
      targetType: filePath
      filePath: '$(DiagnosticRoot)\build_hosted.ps1'
      arguments: '-RepositoryRoot "$(Build.SourcesDirectory)" -PrivateRoot "$(PrivateRoot)" -PublishRoot "$(PublishRoot)"'
  - powershell: |
      $deadline = (Get-Content -LiteralPath "$(PrivateRoot)\control.json" -Raw | ConvertFrom-Json).work_deadline_unix_ms
      $prefix = 'call "$(PrivateRoot)\bin\native_probe.exe" --plain ' + $deadline + ' python "$(DiagnosticRoot)\hosted_shutdown.py" '
      & $env:ComSpec /d /c ($prefix + 'self-test --repo "$(Build.SourcesDirectory)" --private "$(PrivateRoot)" --out "$(PublishRoot)" > "$(PrivateRoot)\self-test.stdout.raw.log" 2> "$(PrivateRoot)\self-test.stderr.raw.log"')
      if ($LASTEXITCODE -ne 0) { throw 'No-DB collector/symbol/deadline/privacy smoke failed.' }
      & $env:ComSpec /d /c ($prefix + 'run --repo "$(Build.SourcesDirectory)" --private "$(PrivateRoot)" --out "$(PublishRoot)" --sql-version "$(sqlVersion)" --repetitions 100 > "$(PrivateRoot)\runner.stdout.raw.log" 2> "$(PrivateRoot)\runner.stderr.raw.log"')
      $code = $LASTEXITCODE
      Write-Host "Candidate acceptance runner exit code: $code"
      exit $code
    timeoutInMinutes: 30
    displayName: Seven workloads x100 fresh debugged children plus five normal test files
  - powershell: |
      python "$(DiagnosticRoot)\hosted_shutdown.py" publish-check --repo "$(Build.SourcesDirectory)" --private "$(PrivateRoot)" --out "$(PublishRoot)"
      exit $LASTEXITCODE
    condition: always()
    timeoutInMinutes: 2
    displayName: Fail-closed secret/canary and text-only artifact gate
  - task: PublishPipelineArtifact@1
    condition: and(always(), eq(variables['SHUTDOWN_ARTIFACTS_SAFE'], 'true'))
    timeoutInMinutes: 2
    inputs:
      targetPath: '$(PublishRoot)'
      artifact: 'windows-shutdown-$(sqlVersion)-py$(pythonVersion)'
